name: Deploy to GitHub Pages

# Builds the Blazor WebAssembly site (GitHub Pages can't build .NET itself) and
# publishes wwwroot to Pages. MANUAL only — run it from the Actions tab (or
# `gh workflow run "Deploy to GitHub Pages"`) when you want to ship. Pushing to main
# no longer auto-deploys, so you can push often without triggering a build every time.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy instead of queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The WebGL/WASM backend needs the wasm-tools workload (Emscripten/mono browser-wasm).
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish (Release)
        run: dotnet publish web/EvilAliensWeb -c Release -o release

      # This is a PROJECT page (Coamithra.github.io/RotEA26/), so the app is served from
      # /RotEA26/ — rewrite the base href the dev build keeps at "/". If this ever moves to
      # a user/org page or a custom domain at the root, drop this step.
      - name: Fix base href for project page
        run: sed -i 's|<base href="/" />|<base href="/RotEA26/" />|' release/wwwroot/index.html

      # Online co-op build fingerprint (card 11.4): peers must run the IDENTICAL published
      # build, so stamp a hash of blazor.boot.json (fingerprints every assembly) plus all
      # of Content/ (levels/grids/data affect the sim too) into eaBuildHash. NetSession's
      # hello handshake compares it and rejects a stale-cached client with an "update
      # required" notice. Dev builds keep 'dev'.
      # NOTE: this must run BEFORE the 404.html copy so both files carry the stamp.
      - name: Stamp build hash
        run: |
          HASH=$( (sha256sum release/wwwroot/_framework/blazor.boot.json; \
                   find release/wwwroot/Content -type f -print0 | sort -z | xargs -0 sha256sum) \
                  | sha256sum | cut -c1-16)
          sed -i "s|window.eaBuildHash = 'dev'|window.eaBuildHash = '$HASH'|" release/wwwroot/index.html
          grep -q "eaBuildHash = '$HASH'" release/wwwroot/index.html || { echo "build hash stamp failed"; exit 1; }

      # _framework/ has a leading underscore; Jekyll would drop it. Disable Jekyll.
      - name: Disable Jekyll
        run: touch release/wwwroot/.nojekyll

      # SPA fallback so deep links / refresh resolve to the app instead of a Pages 404.
      - name: SPA 404 fallback
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
