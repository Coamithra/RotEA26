# RotEA signaling server — nginx snippet.
# Paste these two location blocks INSIDE the existing 443 server block for
# notzelda.haraldmaassen.com (do not create a new vhost). Then:
#   nginx -t && systemctl reload nginx

location = /rotea/ws {
    proxy_pass http://127.0.0.1:8091/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Signaling sockets are short-lived (clients hang up once WebRTC
    # connects), but allow slow pairings up to the room TTL.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

location = /rotea/health {
    proxy_pass http://127.0.0.1:8091/health;
}
