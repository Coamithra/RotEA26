    <base href="/" />

    <!-- SEO / social (Stage 9). og:image and og:url are ABSOLUTE BY DESIGN -- a link
         preview is fetched by a scraper with no page context, so a relative URL would
         be meaningless. They are the one pair the cutover to relative (card ee61a482)
         does NOT convert -- it only re-points them at the new origin. stamp() rewrites
         <base href> above and deliberately NOT these. -->
    <meta name="description" content="Revenge of the Evil Aliens — a 2008 Xbox Live Indie shoot-'em-up, recovered and ported to play in your browser. Up to 4-player couch co-op, three worlds, retro arcade mayhem." />

<body>

    <div id="app">
        <div id="loading">
            <div class="loading-inner">
                <div class="loading-title">REVENGE OF THE<br/>EVIL ALIENS</div>
                <div class="loading-dots">loading<span>.</span><span>.</span><span>.</span></div>
            </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>

    <!-- Stage 9 on-screen UI: a fullscreen toggle (always) + touch controls (shown only
         on touch devices). Lives OUTSIDE #app so it survives Blazor's mount, which
         replaces #app's loading markup. Wired by the ea-ui script block below. -->

            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">

                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

        <div id="ea-touch">
            <div id="ea-dpad">
                <button class="ea-tbtn ea-up"    type="button" data-key="Up"    aria-label="Move up">&#9650;</button>
                <button class="ea-tbtn ea-left"  type="button" data-key="Left"  aria-label="Move left">&#9664;</button>
                <button class="ea-tbtn ea-right" type="button" data-key="Right" aria-label="Move right">&#9654;</button>
                <button class="ea-tbtn ea-down"  type="button" data-key="Down"  aria-label="Move down">&#9660;</button>
            </div>
            <button id="ea-fire" class="ea-tbtn" type="button" data-key="Mouse1" data-tap="Enter" aria-label="Fire / Select">FIRE</button>
            <button id="ea-back" class="ea-tbtn" type="button" data-tap="Esc" aria-label="Back / Pause">BACK</button>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start();
    </script>

    <script src="_content/nkast.Wasm.Dom/js/JSObject.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.8.0.5.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.8.0.5.js"></script>

    <!-- eaWebcam: the "I Made This!" webcam challenge level's browser half — the
         Teams-style camera-setup dialog, the segmented-person overlay canvas, and
         the collision-mask feed into C# (Compat/WebcamInterop.cs). The heavy
         MediaPipe segmentation payload under lib/mediapipe/ is lazy-loaded from
         inside webcam.js only when the level starts; this script itself is tiny. -->
    <script src="webcam.js"></script>
    <!-- Online co-op WebRTC transport (card 11.4). Inert until eaRtc.host/join is called
         from the menu (or a ?net=...&rtc boot) -- a plain boot touches no server.
         eaBuildHash is stamped with a fingerprint of the published binary at deploy time
         (sha256 of _framework/blazor.boot.json); 'dev' means a local build. Peers must
         run the identical binary -- NetSession's hello handshake compares the hashes. -->
    <script>window.eaBuildHash = 'dev';</script>
    <script src="webrtc.js"></script>

    <script>
        // Web-port debug shortcuts: hand the URL query string to .NET at boot so
        // DebugFlags can parse ?menu / ?noattract / ?level=... (see Compat/DebugFlags.cs).
        window.getDebugQuery = () => (window.location.search || "");

        // Reliable input injection for testing — immune to the rAF frame-timing miss that
        // makes synthetic key events drop (see Compat/DebugInput.cs). Drive from the
        // console / automation: eaPress('Enter'), eaPress('Up'), eaPress('Left', 30).
        window.eaPress = (key, frames) => {
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugPress', String(key), frames || 1); }
            catch (e) { console.warn('[debug] eaPress failed (game not booted yet?): ' + e.message); }
        };

        // The cursor half of eaPress: park the pointer at a DESIGN-SPACE (800x600) point so a
        // scripted eaPress('Mouse1') actually lands on something. Same coordinates the menus
        // record their hit boxes in. eaMouseAt() with no args releases the real mouse.
        window.eaMouseAt = (x, y) => {
            if (x === undefined && y === undefined) {
                try { DotNet.invokeMethod('EvilAliensWeb', 'debugMouseClear'); }
                catch (e) { console.warn('[debug] eaMouseClear failed (game not booted yet?): ' + e.message); }
                return;
            }
            // Reject a half-given or non-numeric position here rather than parking the cursor at
            // NaN, where every hit test silently misses -- eaMouseAt(0) alone produces one.
            var nx = Number(x), ny = Number(y);
            if (!Number.isFinite(nx) || !Number.isFinite(ny)) {
                console.warn('[debug] eaMouseAt(' + x + ', ' + y + '): need two design-space numbers'
                    + ' (800x600), or no arguments to release the cursor -- ignored');
                return;
            }
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugMouseAt', nx, ny); }
            catch (e) { console.warn('[debug] eaMouseAt failed (game not booted yet?): ' + e.message); }
        };
        window.eaMouseClear = () => window.eaMouseAt();

        // Online co-op dev transport (?net=host / ?net=join): a BroadcastChannel between two
        // local tabs -- zero network, dev-only. JS owns the platform object (this channel),
        // C# sees only Compat/Net/NetInterop (the webcam.js pattern); card 11.4 adds a
        // webrtc.js implementation behind the same INetTransport seam. The channel is only
        // constructed when the game calls eaNet.open (i.e. a ?net boot) -- a normal boot
        // creates nothing here. Messages are {from, kind, b64, rel}; own messages are
        // filtered by the per-tab random id (BroadcastChannel already never echoes to the
        // posting channel object, the id guards against exotic embedder setups).
        window.eaNet = (() => {
            let ch = null;
            const myId = Math.random().toString(36).slice(2, 10);
            const bye = () => { try { if (ch) ch.postMessage({ from: myId, kind: 'bye' }); } catch (e) { } };
            return {
                open(room) {
                    if (ch) return;
                    ch = new BroadcastChannel('eanet-' + room);
                    ch.onmessage = (ev) => {
                        const m = ev.data;
                        if (!m || m.from === myId) return;
                        try {
                            if (m.kind === 'bye') DotNet.invokeMethod('EvilAliensWeb', 'netPeerBye', String(m.from));
                            else if (m.kind === 'data') DotNet.invokeMethod('EvilAliensWeb', 'netData', String(m.b64), !!m.rel, String(m.from));
                        } catch (e) { console.warn('[net] rx dispatch failed: ' + e.message); }
                    };
                    // Best-effort clean leave on tab close/navigate; the C# side also has a
                    // stream timeout for silent drops.
                    window.addEventListener('pagehide', bye);
                    console.log('[net] eaNet open room=' + room + ' id=' + myId);
                },
                send(b64, rel) { if (ch) ch.postMessage({ from: myId, kind: 'data', b64: b64, rel: !!rel }); },
                close() { if (ch) { bye(); window.removeEventListener('pagehide', bye); ch.close(); ch = null; } }
            };
        })();

        // QA/demo: trigger the cinematic slow-motion (ghost-trail) effect on demand, as if a
        // 1up powerup was fully charged. Only does anything inside a level with a live ship.
        // Console: eaSlowmo() for the default 12s, or eaSlowmo(6) for a custom duration.
        window.eaSlowmo = (seconds) => {
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugSlowmo', Number(seconds) || 12); }
            catch (e) { console.warn('[debug] eaSlowmo failed (game not booted yet?): ' + e.message); }
        };

        // QA/demo: fire a screen-shake burst on demand (works anywhere, even the menu — it
        // shakes the present blit). Console: eaShake() for a solid 0.6-trauma burst, or
        // eaShake(1) for the full rattle. Tune the shipped feel with the ?shake= URL flag.
        window.eaShake = (trauma) => {
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugShake', Number(trauma) || 0); }
            catch (e) { console.warn('[debug] eaShake failed (game not booted yet?): ' + e.message); }
        };

        // QA/demo: freeze game time for N milliseconds of real time (the hit-stop juice
        // effect). Most visible in a level: eaHitstop() for 120ms, eaHitstop(500) for a
        // long dramatic freeze. Disable the shipped effect with ?hitstop=0.
        window.eaHitstop = (ms) => {
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugHitstop', Number(ms) || 0); }
            catch (e) { console.warn('[debug] eaHitstop failed (game not booted yet?): ' + e.message); }
        };

        // Debug: toggle the collision-hitbox overlay (draws every collidable's shape over the
        // game, colour-coded by kind). eaHitboxes() / eaHitboxes(true) to show, eaHitboxes(false)
        // to hide. Same as booting with the ?hitboxes URL flag. OFF by default.
        window.eaHitboxes = (on) => {
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugHitboxes', on !== false); }
            catch (e) { console.warn('[debug] eaHitboxes failed (game not booted yet?): ' + e.message); }
        };

        // Debug: run the ComponentBin lifecycle scenario suite (instant births, deferred
        // deaths, purge filter, pause-aware adds — card 02d9ad67). Prints PASS/FAIL per
        // scenario. Best run from the main menu (the pause scenario Push/Pops the world).
        window.eaBinTest = () => {
            try { console.log(DotNet.invokeMethod('EvilAliensWeb', 'debugBinTest')); }
            catch (e) { console.warn('[debug] eaBinTest failed (game not booted yet?): ' + e.message); }
        };

        // Debug: read the WORLD clock (card d79a2f48) — the clock every Draw-time cosmetic reads
        // instead of gameTime.TotalGameTime, plus the ComponentBin freeze depth that gates it.
        // Prints `[worldclock] seconds= frozen= depth=`. Pause the game and call it twice: the
        // seconds must not move. eaWorldClock.reset() rezeroes it (cosmetic phases only), which
        // is what lets a probe assert an exact reading instead of a boot-tick count.
        window.eaWorldClock = () => {
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugWorldClock'); }
            catch (e) { console.warn('[debug] eaWorldClock failed (game not booted yet?): ' + e.message); }
        };
        window.eaWorldClock.reset = () => {
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugWorldClockReset'); }
            catch (e) { console.warn('[debug] eaWorldClock.reset failed (game not booted yet?): ' + e.message); }
        };

        // Debug: dump the AI telemetry (card f4d1721f) — wall contacts (counted even under
        // ?invuln), the heading-reversal jitter rate, fire idleness, level progress and the run
        // verdict. Only meaningful on a ?aibench boot, e.g.
        //   ?level=Level3&wallsonly&aiplayer&invuln&aibench&aiff=8
        // eaAiBench.reset() rearms the counters mid-run to score one section at a time.
        window.eaAiBench = () => {
            try { console.log(DotNet.invokeMethod('EvilAliensWeb', 'debugAiBench')); }
            catch (e) { console.warn('[debug] eaAiBench failed (game not booted yet?): ' + e.message); }
        };
        window.eaAiBench.reset = () => {
            try { console.log(DotNet.invokeMethod('EvilAliensWeb', 'debugAiBenchReset')); }
            catch (e) { console.warn('[debug] eaAiBench.reset failed (game not booted yet?): ' + e.message); }
        };
        // eaAiBench.row() — the same counters as eaAiBench() but as one machine-readable
        // key=value line. What eaAiBench.matrix() records per run; handy on its own for a
        // manual soak you want to paste somewhere.
        window.eaAiBench.row = () => {
            try { console.log(DotNet.invokeMethod('EvilAliensWeb', 'debugAiBenchRow')); }
            catch (e) { console.warn('[debug] eaAiBench.row failed (game not booted yet?): ' + e.message); }
        };
        window.eaAiBench.world = () => {
            try { console.log(DotNet.invokeMethod('EvilAliensWeb', 'debugAiBenchWorld')); }
            catch (e) { console.warn('[debug] eaAiBench.world failed: ' + e.message); }
        };
        // eaAiBench.soak(simSeconds) — run the AI headless: tick the real game loop at a fixed
        // 60Hz dt with NO Draw, in bounded chunks, until simSeconds elapse or the level ends.
        // This is the only reliable way to soak from automation — a background tab throttles rAF
        // (and MessageChannel) to ~1Hz, so a rendered run measures almost nothing. Resolves with
        // the final report. Chunked with a yield between so the page stays responsive.
        window.eaAiBench.soak = async (simSeconds, chunk) => {
            const total = simSeconds || 120, step = chunk || 10;
            let done = 0, verdict = 'running';
            while (done < total && verdict === 'running') {
                let r;
                try { r = DotNet.invokeMethod('EvilAliensWeb', 'debugAiBenchRun', Math.min(step, total - done)); }
                catch (e) { console.warn('[debug] eaAiBench.soak failed: ' + e.message); return; }
                const parts = r.split(' ');
                const ran = parseFloat(parts[0]);
                verdict = parts.slice(1).join(' ');
                if (!(ran > 0)) { console.warn('[aibench] soak stopped: ' + verdict); break; }
                done += ran;
                // Yield via MessageChannel, NOT setTimeout: Chrome applies "intensive throttling"
                // to timers in a backgrounded tab after ~5 minutes, dropping them to ~1/minute --
                // which silently stalls a long soak and reads as "the AI stopped progressing".
                // A message-port callback is not a timer and is not throttled that way.
                await new Promise(r2 => { const c = new MessageChannel(); c.port1.onmessage = () => r2(); c.port2.postMessage(0); });
            }
            console.log('[aibench] soak ran ' + done.toFixed(1) + 's sim -> ' + verdict);
            window.eaAiBench();
        };

        // eaAiBench.matrix(...) — the AI completion sweep (card 9391f95a). The manual recipe is
        // one boot per level: type the URL, wait for WASM, eaAiBench.soak(n), read one line.
        // Twenty-seven of those by hand is where the honesty goes, so this drives exactly that
        // recipe and nothing more.
        //
        // ONE FRESH PAGE LOAD PER RUN, with the plan carried in sessionStorage and resumed at
        // boot. NOT an in-process relaunch: a level LOCKS the difficulty, seeds score.Lives and
        // consumes the shared RNG, so runs sharing a page would measure each other's leftovers —
        // and a single wedged run would take the whole sweep down instead of one row.
        //
        // The third verdict lives here, not in C#: AiBench cannot tell "the cap was reached"
        // from "still going", and on the eight challenge levels that run with score.Lives = -1
        // (GameScene.Initialize; only InsaneBossI overrides it) a GAME OVER can never arrive at
        // all — "never finished" IS how those fail, so TIMEOUT has to be a first-class outcome.
        // For the same reason an INFRASTRUCTURE failure must never be able to wear the TIMEOUT
        // label: "the bot could not finish" is the whole claim the sweep exists to make, so a
        // dead runtime or a level that never booted reports ERROR / NO LEVEL instead.
        //
        //   eaAiBench.matrix()                          — 9 challenge levels x 3 runs, Very_Hard
        //   eaAiBench.matrix(['OwnLevel'], 600, 1)      — one level, 600 sim-seconds, one run
        //   eaAiBench.matrix.results()  .status()  .stop()
        //
        // Fire and forget — never await it. Each run outlives any single devtools/CDP eval, and
        // the sweep survives the navigations that an awaited promise could not.
        //
        // KEEP THE TAB FOREGROUNDED. The soak itself is rAF-independent (that is its whole
        // point), but the BOOT of each run is not: Game1.WarmThenLaunch decodes one texture per
        // rAF tick, and a backgrounded tab throttles rAF — so a hidden sweep times out waiting
        // for the level and every row comes back NO LEVEL.
        (() => {
            // Namespaced like the file's other web-storage keys (eaweb_save:, eaweb_loadprofile):
            // the live site shares an origin with the other games on coamithra.github.io.
            const KEY = 'eaweb_aimatrix';
            // Bumped when the plan's SHAPE changes. load() drops anything that does not match, so
            // a plan left by another version of this code can never be half-read by this one.
            const PLAN_VERSION = 1;
            // WebcamAliens is excluded by design: it is camera-driven and has no
            // ControlDevice.AI ship path at all.
            const LEVELS = ['Tutorial', 'Braineroids', 'SpaceDodge', 'OwnLevel', 'ClassicAliens',
                            'InsaneBossI', 'TeamChallenge', 'CrazyGame', 'Paratrooper'];
            // Set by .stop(), and checked by the in-flight run before it saves or navigates: the
            // running runOne holds `plan` in a closure, so clearing storage alone would let it
            // save its copy back and resurrect the sweep it was told to end.
            let stopped = false;
            const load = () => {
                try {
                    const p = JSON.parse(sessionStorage.getItem(KEY) || 'null');
                    return (p && p.v === PLAN_VERSION && Array.isArray(p.queue)) ? p : null;
                } catch (e) { return null; }
            };
            // Reports rather than swallowing: if this silently fails mid-sweep, plan.at never
            // advances, the next page loads the same plan and re-runs the same level — an
            // invisible infinite navigation loop. Same shape as eaSave.set / eaLoadProfile.save.
            const save = (p) => {
                try { sessionStorage.setItem(KEY, JSON.stringify(p)); return true; }
                catch (e) {
                    console.warn('[aibench] matrix: could not save the plan (storage full or disabled?) — '
                        + 'stopping rather than looping on the same run: ' + e.message);
                    stopped = true;
                    return false;
                }
            };
            const yieldTick = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });

            const urlFor = (plan, i) => {
                const level = plan.queue[i];
                // No per-level special-casing: every level benches on the same flags (TeamChallenge
                // needed ?aiteam until card e6927ef8 stopped its partner slot seating a pad that
                // is not there — ?teampartner=pad reaches that force-pause deliberately).
                return location.pathname + '?level=' + level + '&aiplayer&aibench&nofps'
                    + '&difficulty=' + plan.difficulty;
            };

            const parseRow = (s) => {
                const o = {};
                String(s || '').split(' ').forEach(kv => {
                    const i = kv.indexOf('=');
                    if (i > 0) { o[kv.slice(0, i)] = kv.slice(i + 1); }
                });
                return o;
            };

            const table = (plan) => {
                const rows = plan.results || [];
                if (!rows.length) { return '[aibench] matrix: no runs recorded yet'; }
                const head = '| level | run | verdict | sim s | deaths | prog | contacts | revs/s | coast% | idle% |';
                const sep  = '|---|---|---|---|---|---|---|---|---|---|';
                // Row() sends the verdict space-free so it survives the key=value split.
                const body = rows.map(r => '| ' + [r.level, r.run, String(r.verdict).replace(/_/g, ' '), r.sim, r.deaths,
                    r.prog + '/' + r.progTotal, r.contacts, r.revs, r.coast, r.idle].join(' | ') + ' |');
                // The difficulty the runs OBSERVED, not the one that was asked for. ?difficulty=
                // falls through silently on a typo, so a whole sweep can run at the saved tier
                // while the header claims Very_Hard — which would then be copied into a doc.
                const seen = rows.map(r => r.difficulty).filter(Boolean);
                const actual = seen.filter((d, i) => seen.indexOf(d) === i);
                const asked = plan.difficulty;
                const diffNote = (actual.length && (actual.length > 1 || actual[0] !== asked))
                    ? ' MEASURED AT ' + actual.join('+') + ' (asked for ' + asked + ')' : '';
                return ['[aibench] completion matrix — difficulty=' + asked + diffNote
                    + ' cap=' + plan.cap + 's runs=' + plan.runs,
                    head, sep].concat(body).join('\n');
            };

            // Wait for the .NET runtime AND for the level to actually be up: ?level= launches
            // through Game1.WarmThenLaunch, which decodes the level's textures one per tick, so
            // there are seconds of live ticks during which no GameScene exists yet.
            const waitForLevel = async (level, timeoutMs) => {
                const deadline = performance.now() + timeoutMs;
                while (performance.now() < deadline) {
                    try {
                        const row = parseRow(DotNet.invokeMethod('EvilAliensWeb', 'debugAiBenchRow'));
                        if (row.level === level) { return 'ok'; }
                        if (row.off) { return 'no-aibench'; }
                    } catch (e) { /* runtime not up yet */ }
                    await new Promise(r => setTimeout(r, 250));
                }
                return 'timeout';
            };

            // Every column the table prints, so a row built on a failure path renders as '-'
            // rather than the word "undefined" in five cells.
            const blankRow = (verdict) => ({ verdict: verdict, sim: '0', deaths: '-', prog: '0',
                progTotal: '0', contacts: '-', shots: '-', revs: '-', turn: '-', coast: '-', idle: '-' });

            const runOne = async (plan) => {
                const i = plan.at, level = plan.queue[i];
                const boot = await waitForLevel(level, 90000);
                let row;
                if (boot !== 'ok') {
                    // NOT a TIMEOUT: nothing was measured. Name the cause, because "the level
                    // never came up" and "the bot could not finish it" are opposite conclusions.
                    row = blankRow(boot === 'no-aibench' ? 'NO AIBENCH' : 'NO BOOT');
                    console.warn('[aibench] matrix: ' + level + ' — ' + (boot === 'no-aibench'
                        ? '?aibench is off, nothing to measure'
                        : 'the level never came up within 90s. Is the tab backgrounded? '
                          + 'The per-run boot decodes one texture per rAF tick and rAF throttles when hidden.'));
                } else {
                    // Rearm now that the level is actually up. AiBench.Update runs on EVERY
                    // tick, including the ~20s of real rAF frames spent booting WASM and warming
                    // the level's textures -- without this the row's clock overshoots the cap by
                    // the boot time and its coast%/idle% are diluted by ticks with no level.
                    DotNet.invokeMethod('EvilAliensWeb', 'debugAiBenchReset');
                    let done = 0, verdict = 'running', failure = null;
                    while (done < plan.cap && verdict === 'running') {
                        let r;
                        try { r = DotNet.invokeMethod('EvilAliensWeb', 'debugAiBenchRun', Math.min(10, plan.cap - done)); }
                        catch (e) { failure = 'ERROR'; console.warn('[aibench] matrix: ' + level + ' soak threw: ' + e.message); break; }
                        const parts = r.split(' ');
                        const ran = parseFloat(parts[0]);
                        verdict = parts.slice(1).join(' ');
                        // RunHeadless refuses (0 OFF / 0 NOGAME) or made no progress. The soak
                        // ended early for a reason that is NOT the AI running out of time.
                        if (!(ran > 0)) { failure = 'STALLED'; console.warn('[aibench] matrix: ' + level + ' soak stopped early: ' + verdict); break; }
                        done += ran;
                        await yieldTick();
                    }
                    if (failure) {
                        row = blankRow(failure);
                    } else {
                        row = parseRow(DotNet.invokeMethod('EvilAliensWeb', 'debugAiBenchRow'));
                        // The cap ran out with the level still going. On a score.Lives = -1 level
                        // that is the ONLY way to fail, so it must read as a distinct outcome and
                        // never as a blank or a pass. Reached only when the soak ran clean —
                        // an infrastructure failure above must not borrow this label.
                        if (row.verdict === 'running') { row.verdict = 'TIMEOUT'; }
                        if (row.noship) { row = Object.assign(blankRow('NO SHIP'), { sim: row.sim, prog: row.prog, progTotal: row.progTotal, difficulty: row.difficulty }); }
                    }
                }
                row.level = level;
                row.run = plan.runOf[i];
                (plan.results = plan.results || []).push(row);
                plan.at++;
                console.log('[aibench] matrix ' + plan.at + '/' + plan.queue.length + ' — '
                    + level + ' run ' + row.run + ': ' + row.verdict
                    + ' at ' + row.sim + 's sim, deaths=' + row.deaths + ' prog=' + row.prog + '/' + row.progTotal);
                // .stop() during this run, or a storage failure: do not persist and do not
                // navigate, or the sweep restarts itself on the next page.
                if (stopped || !save(plan)) { console.log(table(plan)); return; }
                if (plan.at < plan.queue.length) { location.replace(urlFor(plan, plan.at)); return; }
                plan.done = true;
                save(plan);
                console.log(table(plan));
            };

            // A run must never take the SWEEP down -- one fresh page per run exists precisely so
            // a wedged run costs one row. Record the failure, advance, and carry on.
            const runOneGuarded = (plan) => runOne(plan).catch(e => {
                console.warn('[aibench] matrix: ' + plan.queue[plan.at] + ' run failed: ' + e.message);
                (plan.results = plan.results || []).push(Object.assign(blankRow('ERROR'),
                    { level: plan.queue[plan.at], run: plan.runOf[plan.at] }));
                plan.at++;
                if (stopped || !save(plan)) { return; }
                if (plan.at < plan.queue.length) { location.replace(urlFor(plan, plan.at)); return; }
                plan.done = true;
                save(plan);
                console.log(table(plan));
            });

            window.eaAiBench.matrix = (levels, simSeconds, runs, difficulty) => {
                // A bare string is the easy mistake (the doc line shows an array); without this
                // it passes the truthiness test, survives .slice(), and throws in forEach.
                const asked = (typeof levels === 'string') ? [levels] : levels;
                const lv = (asked && asked.length) ? Array.prototype.slice.call(asked) : LEVELS.slice();
                const unknown = lv.filter(l => LEVELS.indexOf(l) < 0);
                // A typo costs 90s of dead waiting per run and yields rows that look like
                // failures, so refuse up front the way DebugFlags does for a bad ?level=.
                if (unknown.length) {
                    console.warn('[aibench] matrix: unknown level(s) ' + unknown.join(', ')
                        + '. Known: ' + LEVELS.join(', '));
                    return;
                }
                const n = Math.max(1, Number(runs) || 3);
                const plan = { v: PLAN_VERSION, difficulty: difficulty || 'Very_Hard',
                               cap: Number(simSeconds) || 1800,
                               runs: n, queue: [], runOf: [], at: 0, results: [], done: false };
                // Pass by pass, not level by level: a full matrix exists after the first pass, so
                // an interrupted sweep still answers the card for every level.
                for (let r = 1; r <= n; r++) { lv.forEach(l => { plan.queue.push(l); plan.runOf.push(r); }); }
                // Any run still executing on THIS page would otherwise save its own (now stale)
                // plan over the one just written, and navigate to its own next run.
                stopped = true;
                if (!save(plan)) { return; }
                stopped = false;
                console.log('[aibench] matrix: ' + plan.queue.length + ' runs queued ('
                    + lv.length + ' levels x ' + n + '), cap ' + plan.cap + 's sim, '
                    + plan.difficulty + '. The page will reload once per run — keep the tab foregrounded.');
                location.replace(urlFor(plan, 0));
            };
            window.eaAiBench.matrix.results = () => { const p = load(); console.log(p ? table(p) : '[aibench] matrix: no sweep in this tab'); };
            window.eaAiBench.matrix.status = () => {
                const p = load();
                console.log(p ? ('[aibench] matrix ' + p.at + '/' + p.queue.length + (p.done ? ' (done)' : ' (running)'))
                              : '[aibench] matrix: no sweep in this tab');
            };
            window.eaAiBench.matrix.stop = () => {
                stopped = true;
                try { sessionStorage.removeItem(KEY); } catch (e) { }
                console.log('[aibench] matrix: stopped — the run in flight finishes but records nothing '
                    + 'and does not advance. This page keeps playing.');
            };

            // Resume on boot. This runs inside the page's main <script>, so an uncaught throw
            // here would abort every definition BELOW it -- including eaQuit, which is SHIPPED
            // behaviour (the main menu's Exit -> Meridian handoff). Hence the try around the
            // whole thing, not just the async rejection.
            try {
                const plan = load();
                if (plan && !plan.done && plan.at < plan.queue.length) { runOneGuarded(plan); }

                console.warn('[aibench] matrix: could not resume a stored plan: ' + e.message);

                    console.error('[loop] too many consecutive tick failures — game loop stopped.');

                    return; // stop rescheduling: the game is wedged, not just hiccuping
