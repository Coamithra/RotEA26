            if (window.eaFpsAfterTick) {
                try { window.eaFpsAfterTick(); }
                catch (e) { console.warn('[fps] after-tick hook failed, disabling: ' + ((e && e.message) || e)); window.eaFpsAfterTick = null; }
            }
            scheduleTick();
        }

        // Terminal-stop notice: once the loop gives up, the canvas is a frozen frame with no
        // hint that the game died. Drop a minimal overlay pointing the player at a reload so
        // they aren't left staring at a stuck screen. Built outside #app so it survives Blazor.
        function showLoopStopped()
        {
            if (document.getElementById('eaLoopStopped')) return; // one-shot
            var ov = document.createElement('div');
            ov.id = 'eaLoopStopped';
            ov.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
                + 'background:rgba(0,0,0,.82);color:#e8e8f0;font:600 18px/1.5 system-ui,sans-serif;'
                + 'text-align:center;padding:24px;z-index:99999';
            ov.innerHTML = 'The game hit an unrecoverable error and stopped.<br>Please reload the page to restart.';
            document.body.appendChild(ov);
        }

        // The uncapped pump (eaFpsUncapped). A MessageChannel post schedules a macrotask with
        // no clamp — setTimeout(0) is floored at ~4ms (≈250fps) by every browser, which would
        // put a fake ceiling on the very number the uncapped mode exists to measure. It still
        // yields to the event loop between frames, so the page stays responsive enough to turn
        // the mode back off.
        var uncapChannel = null;
        function pumpUncapped()
        {
            if (!uncapChannel)
            {
                uncapChannel = new MessageChannel();
                uncapChannel.port1.onmessage = function () { tickJS(); };
            }
            uncapChannel.port2.postMessage(0);
        }

        function scheduleTick()
        {
            // Browsers pause requestAnimationFrame in a backgrounded/hidden tab,
            // which would freeze the game (and stall headless/preview captures).
            // Fall back to setTimeout (~30fps) when hidden so the loop keeps
            // running; use rAF when visible for smooth, vsync-aligned frames.
            if (document.hidden)
                setTimeout(tickJS, 33);
            else if (window.eaFpsUncapped)
                pumpUncapped();
            else
                window.requestAnimationFrame(tickJS);
        }

        function sizeCanvas()
        {
            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            if (!canvas || !holder)
                return;
            // The KNI back buffer follows the canvas drawing-buffer size, and KNI itself
            // re-syncs it to window.innerWidth/Height on every resize (GameWindow.OnResize),
            // so match that here for the first frame. The game renders at its native
            // 800x600 into an offscreen target and Game1.Draw blits it scaled+letterboxed
            // to this window-sized buffer (so the scene fills the window, aspect-correct).
            // Fall back to the window / 16:9 default when the holder hasn't laid out yet.
            canvas.width = holder.clientWidth || window.innerWidth || 1280;
            canvas.height = holder.clientHeight || window.innerHeight || 720;
        }

        window.initRenderJS = async (instance) =>
        {
            window.theInstance = instance;

            sizeCanvas();
            window.addEventListener("resize", sizeCanvas);
            // disable context menu on right click
            document.getElementById('theCanvas').addEventListener("contextmenu", e => e.preventDefault());

            // Tell the game when the mouse is over the canvas so the software reticle
            // (MousePointer) hides off-canvas and the OS cursor takes over there.
            var eaSetOnCanvas = function (on) {
                try { DotNet.invokeMethod('EvilAliensWeb', 'eaPointerOnCanvas', !!on); }
                catch (e) { /* game not booted yet */ }
            };
            document.getElementById('theCanvas').addEventListener("pointerenter", () => eaSetOnCanvas(true));
            document.getElementById('theCanvas').addEventListener("pointerleave", () => eaSetOnCanvas(false));

            // Latch a mouse press for the game tick (card 724f2abc, Compat/MouseLatch.cs).
            // InputHandler polls Mouse.GetState() once per tick and edge-detects, so a click
            // whose press and release both land BETWEEN two polls is never observed -- the
            // cursor position survives it, so a menu row hover-highlights and never invokes.
            // Measured: an automated CDP click holds the button for ~1ms, i.e. it essentially
            // never invoked anything; a human click on a hitching frame is the same bug.
            // TWO deliberate scopings, both narrowing this to exactly the input being restored:
            //  - THE CANVAS, not the window: a window listener would also fire a game click for
            //    every press on the outside-#app UI (fullscreen button, touch D-pad, FPS HUD,
            //    tuning panels), which is what pointer-events:none exists to prevent.
            //  - pointerType MOUSE, not any pointer: a touch tap synthesises a back-to-back
            //    mousedown/mouseup, so it is a sub-tick click BY CONSTRUCTION and would newly
            //    start firing the ship / invoking menu rows on every tap of the canvas. Touch
            //    has its own overlay (#ea-touch -> eaHold) and gets no new behaviour here.
            //    Pen is excluded with it -- same reasoning, and unverifiable on this rig.
            var eaMouseLatchFailed = false;
            document.getElementById('theCanvas').addEventListener("pointerdown", (e) => {
                if (e.pointerType !== 'mouse') return;
                try { DotNet.invokeMethod('EvilAliensWeb', 'eaMouseDown', e.button | 0); }
                catch (err) {
                    // This listener is attached from initRenderJS, which .NET itself calls, so
                    // the runtime is up and eaMouseDown only writes a static bool -- it cannot
                    // legitimately throw. A failure here (renamed export, changed assembly name)
                    // presents as "menu rows highlight but never invoke", i.e. exactly the bug
                    // this exists to fix, so it must not be swallowed silently. Once only.
                    if (!eaMouseLatchFailed) {
                        eaMouseLatchFailed = true;
                        console.warn('[input] eaMouseDown failed -- sub-tick clicks will be dropped: ' + err.message);
                    }
                }
            });

            // A click that is not ON the canvas is not game input (card 0fe23476).
            // The latch above is canvas-scoped for exactly that reason -- but it is only the
            // sub-tick RESCUE. The primary read is InputHandler polling Mouse.GetState(), and
            // KNI's own listeners are on the WINDOW (nkast.Wasm.Dom Window.js), so the button
            // state of a press on any outside-#app UI still reaches the game at that cursor
            // position, and the game acts on it. Reported case: the room-code prompt's JOIN
            // button sits over the live NetStatusMenu's single CANCEL row, so clicking JOIN
            // cancelled the join -- unfixable from the DOM, because the game never sees the DOM
            // event. Same leak for the fullscreen button, the FPS HUD tag and the tuning panels.
            // CAPTURE phase on window, so an overlay that stops propagation is still counted;
            // released on pointerup rather than after a tick, so a drag that starts on an
            // overlay and ends over the canvas does not land as a click either (C# then swallows
            // that button until it is physically released -- see MouseLatch.Filter).
            var eaMouseSuppressFailed = false;
            var eaMouseSuppress = (on) => {
                try { DotNet.invokeMethod('EvilAliensWeb', 'eaMouseSuppress', !!on); }
                catch (err) {
                    if (!eaMouseSuppressFailed) {
                        eaMouseSuppressFailed = true;
                        console.warn('[input] eaMouseSuppress failed -- off-canvas clicks will reach the game: ' + err.message);
                    }
                }
            };
            window.addEventListener("pointerdown", (e) => {
                if (e.pointerType !== 'mouse') return;   // touch has its own overlay (eaHold)
                var canvas = document.getElementById('theCanvas');
                if (canvas && (e.target === canvas || canvas.contains(e.target))) return;
                eaMouseSuppress(true);
            }, true);
            // pointercancel too: a press can end without a pointerup (the browser stealing the
            // pointer for a drag/gesture), and a suppression that never lifts is a dead mouse.
            window.addEventListener("pointerup", () => eaMouseSuppress(false), true);
            window.addEventListener("pointercancel", () => eaMouseSuppress(false), true);
            // Mouse pointers get no implicit capture, so releasing the button OUTSIDE the window
            // delivers neither event and the flag would stay set -- a dead mouse until the next
            // click anywhere. Losing the window is how that happens, so lift it there too.
            window.addEventListener("blur", () => eaMouseSuppress(false));

            // Pull the level-select screenshot blobs out of IndexedDB into memory BEFORE the
            // first game tick, so the synchronous save-hydrate (StorageStub, on the first
            // OpenContainer a few ticks in) sees them. IndexedDB is async but the game reads
            // saves synchronously — awaiting here is the guaranteed ordering gate. Fast (a
            // getAll of a handful of blobs) and best-effort: a failure never blocks boot.
            try { await window.eaSaveBlob.preload(); }
            catch (e) { console.warn("[eaSaveBlob] preload failed", e); }

            // begin game loop
            scheduleTick();
        };

        // eaQuit: the main-menu "Exit" "boss key". A browser tab can't really quit, so
        // we "close" the game (fade the canvas to black) and hand off to the shared
        // Meridian desktop -- now its own repo/site (the fake corporate decoy + the
        // games launcher). We pass ?from=evilaliens so Meridian's Shut Down returns
        // here. C# reaches this via Compat/ExitInterop.Quit().
        window.eaQuit = function ()
        {
            // Single knob: where Meridian lives.
            // SAME-ORIGIN SIBLINGS since the cutover (card ee61a482): the game serves from
            // haraldmaassen.com/RotEA26/ and Meridian from haraldmaassen.com/meridian/, both
            // directories directly under the account web root /public_html/. So this is a
            // RELATIVE path, not the cross-origin absolute URL it used to be -- which is the
            // whole point of deploying the game as Meridian's sibling.
            // It resolves through document.baseURI below, so it follows the deploy's stamped
            // <base href="/RotEA26/"> and a dev build's "/" alike.
            // Target the explicit index.html (not the bare directory) so a static host
            // serves the file directly rather than through any SPA fallback.
            var MERIDIAN_BASE = "../meridian/";
            var url;
            try { url = new URL("index.html?from=evilaliens", new URL(MERIDIAN_BASE, document.baseURI)).href; }
            catch (e) { url = MERIDIAN_BASE + "index.html?from=evilaliens"; }
            var ov = document.createElement("div");
            ov.style.cssText = "position:fixed;inset:0;background:#000;opacity:0;z-index:99999;transition:opacity .5s ease";
            document.body.appendChild(ov);
            requestAnimationFrame(function () { ov.style.opacity = "1"; });
            setTimeout(function () { window.location.href = url; }, 560);
        };

        // Prevent arrow keys / spacebar / wheel from scrolling the page (esp. in an iframe)
        window.addEventListener("keydown", function(event)
        {
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function(event)
        {
            event.preventDefault();
        }, { passive: false });
    </script>

    <script>
        // ----- Stage 9: browser fullscreen + on-screen touch controls -----------
        // eaFullscreen drives the DOM Fullscreen API (KNI's graphics.IsFullScreen is a
        // no-op on BlazorGL). Entering/leaving just resizes the canvas, which KNI already
        // follows and Game1.Draw letterboxes — no graphics work needed. C# reaches set()
        // via Compat/FullscreenInterop (the in-menu "Fullscreen" option); the corner
        // button is the guaranteed-gesture path.
        window.eaFullscreen = (function ()
        {
            var docEl = document.documentElement;
            function supported()
            {
                return !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);
            }
            function isFs()
            {
                return !!(document.fullscreenElement || document.webkitFullscreenElement);
            }
            function enter()
            {
                var fn = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
                if (!fn) return;
                try { var r = fn.call(docEl); if (r && r.catch) r.catch(function () { }); }
                catch (e) { /* rejected without a gesture — non-fatal */ }
            }
            function exit()
            {
                var fn = document.exitFullscreen || document.webkitExitFullscreen;
                if (!fn) return;
                try { var r = fn.call(document); if (r && r.catch) r.catch(function () { }); }
                catch (e) { }
            }
            return {
                supported: supported,
                isFullscreen: isFs,
                toggle: function () { if (isFs()) exit(); else enter(); },
                set: function (on) { if (on && !isFs()) enter(); else if (!on && isFs()) exit(); }
            };
        })();

        // eaCursor: owns the OS cursor over the game canvas (card 51276dcd). KNI's BlazorGL
        // never applies Game.IsMouseVisible to the DOM, so C# (Compat/CursorInterop ->
        // MousePointer) drives canvas.style.cursor through here per scene:
        //   "menu"    -> normal OS arrow (menus / non-aiming scenes)
        //   "hidden"  -> cursor:none, while the gameplay intro reticle SPRITE animates
        //   "reticle" -> the zero-lag aiming reticle IS the OS cursor during gameplay
        // A CSS cursor image is a fixed pixel size and can't be scaled, but the game
        // letterbox-upscales its 800x600 design space to the window -- so the reticle ships as a
        // LADDER of pre-drawn sizes at wwwroot/reticle/<px>.png (built by
        // tools/cursor/build_cursor.py) and MousePointer passes the rung matching the current
        // letterbox. Resolve against <base href> so it works under the CI "/RotEA26/" base too.
        // Hotspot is the image centre (px/2) since the reticle aims from its centre; `crosshair`
        // is the graceful fallback if a browser rejects the custom image.
        window.eaCursor = (function ()
        {
            var reticleCss = {};   // px -> css value (each rung is a separate image)
            function reticle(px)
            {
                if (!reticleCss[px])
                {
                    var rel = "reticle/" + px + ".png";
                    var href = rel;
                    try { href = new URL(rel, document.baseURI).href; } catch (e) { }
                    var hot = px / 2;
                    reticleCss[px] = "url('" + href + "') " + hot + " " + hot + ", crosshair";
                }
                return reticleCss[px];
            }
            return {
                // px is the reticle rung to show; only meaningful for mode 'reticle'.
                set: function (mode, px)
                {
                    var c = document.getElementById('theCanvas');
                    if (!c) return;
                    if (mode === 'reticle') c.style.cursor = reticle(px);
                    else if (mode === 'hidden') c.style.cursor = 'none';
                    else c.style.cursor = 'auto';   // 'menu' / anything else -> normal arrow
                }
            };
        })();

        // eaSuppressEsc: the browser forces Esc to leave DOM fullscreen and that can't be
        // preventDefault'd, but the same Esc keydown ALSO reaches KNI's keyboard state, so Esc
        // would exit fullscreen AND step back a menu at once (card b0a2f525). On every
        // fullscreen EXIT, ask C# to swallow the raw Esc for a short window (a second, deliberate
        // Esc afterwards -- now not fullscreen -- navigates back as normal). F11 gets its own
        // dedicated toggle so it doesn't fight menu navigation.
        window.eaSuppressEsc = function ()
        {
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugSuppressEsc'); }
            catch (e) { /* game not booted yet — ignore */ }
        };
        (function ()
        {
            var onFsChange = function ()
            {
                if (!window.eaFullscreen.isFullscreen()) window.eaSuppressEsc();
            };
            document.addEventListener('fullscreenchange', onFsChange);
            document.addEventListener('webkitfullscreenchange', onFsChange);
            // F11 = dedicated game-fullscreen toggle. preventDefault the browser-native (whole
            // chrome) fullscreen and route through eaFullscreen instead; the keydown is a user
            // gesture, so requestFullscreen is allowed. KNI ignores F11 (not in keysToCheck),
            // so this never fights gameplay/menu keys.
            window.addEventListener('keydown', function (e)
            {
                if (e.key === 'F11' || e.keyCode === 122)
                {
                    e.preventDefault();
                    if (window.eaFullscreen.supported()) window.eaFullscreen.toggle();
                }
            });
        })();

        // eaHold: persistent press for the on-screen D-pad/fire button. Mirrors eaPress
        // but holds the key down until released (see Compat/DebugInput.cs Hold/Consume).
        window.eaHold = function (key, down)
        {
            try { DotNet.invokeMethod('EvilAliensWeb', 'debugHold', String(key), !!down); }
            catch (e) { /* game not booted yet — ignore */ }
        };

        (function ()
        {
            function setup()
            {
                var ui = document.getElementById('ea-ui');
                if (!ui) return;

                var fsBtn = document.getElementById('ea-fs-btn');
                if (fsBtn)
                {
                    if (!window.eaFullscreen.supported())
                    {
                        // iOS Safari et al. can't fullscreen an arbitrary element — hide it.
                        fsBtn.style.display = 'none';
                    }
                    else
                    {
                        fsBtn.addEventListener('click', function (e)
                        {
                            e.preventDefault();
                            window.eaFullscreen.toggle();
                        });
                        var syncFs = function () { ui.classList.toggle('ea-fs-on', window.eaFullscreen.isFullscreen()); };
                        document.addEventListener('fullscreenchange', syncFs);
                        document.addEventListener('webkitfullscreenchange', syncFs);
                    }
                }

                // Touch controls only make sense on a touch device.
                var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                if (isTouch)
                {
                    ui.classList.add('ea-has-touch');
                    var btns = ui.querySelectorAll('#ea-touch .ea-tbtn');
                    Array.prototype.forEach.call(btns, function (b)
                    {
                        var holdKey = b.getAttribute('data-key');   // held while pressed
                        var tapKey = b.getAttribute('data-tap');    // single tap on press
                        var press = function (e)
                        {
                            if (e) e.preventDefault();
                            b.classList.add('ea-active');
                            if (tapKey) window.eaPress(tapKey, 1);
                            if (holdKey) window.eaHold(holdKey, true);
                        };
                        var release = function (e)
                        {
                            if (e) e.preventDefault();
                            b.classList.remove('ea-active');
                            if (holdKey) window.eaHold(holdKey, false);
                        };
                        b.addEventListener('touchstart', press, { passive: false });
                        b.addEventListener('touchend', release, { passive: false });
                        b.addEventListener('touchcancel', release, { passive: false });
                        // Mouse fallback so the overlay is also testable on desktop.
                        b.addEventListener('mousedown', press);
                        b.addEventListener('mouseup', release);
                        b.addEventListener('mouseleave', function (e) { if (b.classList.contains('ea-active')) release(e); });
                        b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
                    });
                }
            }

            if (document.readyState === 'loading')
                document.addEventListener('DOMContentLoaded', setup);
            else
                setup();
        })();
    </script>

    <script>
        // ----- eaTrailer: in-menu trailer player via embedded YouTube (Stage 14) -----
        // The original Xbox trailers (Content/VFX/*.wmv, VC-1) can't play in a browser and
        // the web port has no video loader, so the Options -> Trailers menu hands off to an
        // embedded youtube-nocookie player overlaid on the canvas. Built OUTSIDE #app so
        // Blazor's mount can't wipe it; menu music pauses while it's up and resumes on close.
        // C# reaches eaTrailer(id) via Compat/TrailerInterop; the overlay owns its own close
        // (Back button / Esc / backdrop click), which refocuses the canvas.
        window.eaTrailer = (function ()
        {
            var overlay = null;

            function close()
            {
                if (!overlay) return;
                var ov = overlay; overlay = null;
                if (ov.parentNode) ov.parentNode.removeChild(ov);
                window.removeEventListener('keydown', onKey, true);
                try { if (window.eaMusic) window.eaMusic.resume(); } catch (e) { }
                var c = document.getElementById('theCanvas');
                if (c && c.focus) { try { c.focus(); } catch (e) { } }
            }

            // While a trailer is up the overlay owns the GAME keys: swallow just the menu
            // navigation/activation keys (window capture, before KNI's canvas listener) so the
            // menu hidden under the opaque overlay can't be blind-navigated; Escape closes.
            // Everything else — F5/Ctrl+R reload, F12 devtools, Ctrl+T, tab switching, and any
            // modified chord — passes straight through so the browser stays usable. Keys typed
            // inside the cross-origin YouTube iframe don't reach here, so its own controls work
            // when it has focus.
            // Keyed by e.keyCode, not e.key: KNI maps keys by event.keyCode too (see
            // CLAUDE.md), so a WASD keyCode (87/65/83/68) is layout-independent — on a
            // non-Latin layout keyCode 87 is still "W" for the game even though e.key is
            // 'ц', so matching the physical code keeps the menu unreachable there too.
            var GAME_KEYS = {
                38: 1, 40: 1, 37: 1, 39: 1,   // Arrow Up/Down/Left/Right
                13: 1,                        // Enter
                32: 1,                        // Space
                87: 1, 65: 1, 83: 1, 68: 1    // W A S D
            };
            function onKey(e)
            {
                if (e.key === 'Escape' || e.keyCode === 27)
                {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                    close();
                    return;
                }
                // Never intercept a browser shortcut chord (reload, new tab, etc.).
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                if (GAME_KEYS[e.keyCode])
                {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                }
            }

            function open(id)
            {
                if (!id) return;
                close();                                  // replace any open trailer
                try { if (window.eaMusic) window.eaMusic.pause(); } catch (e) { }

                var ov = document.createElement('div');
                ov.id = 'ea-trailer';
                // youtube-nocookie + autoplay (the menu keypress/click is the gesture) + rel=0
                // so end cards don't suggest unrelated channels; playsinline for iOS.
                ov.innerHTML =
                    '<div class="ea-trailer-frame">' +
                        '<iframe allow="autoplay; encrypted-media; fullscreen" allowfullscreen ' +
                            'src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
                            '?autoplay=1&rel=0&modestbranding=1&playsinline=1"></iframe>' +
                    '</div>' +
                    '<button type="button" class="ea-trailer-close" aria-label="Close trailer">&#9664; Back</button>';
                document.body.appendChild(ov);
                overlay = ov;

                ov.querySelector('.ea-trailer-close')
                    .addEventListener('click', function (e) { e.preventDefault(); close(); });
                // Click on the dim backdrop (outside the video frame) closes too.
                ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
                window.addEventListener('keydown', onKey, true);
            }

            window.eaTrailerClose = close;
            return open;
        })();
    </script>

    <script>
        // ----- ?fx live FX tuning panel (dev only) --------------------------
        // On-screen buttons to toggle render features while dialing in the new
        // starfield. Built ONLY when the URL query contains `fx`, so normal play
        // and the live site never see it. Each change is pushed to C# DebugToggles
        // via DotNet.invokeMethod('EvilAliensWeb','debugFx', key, value). Defaults
        // start CLEAN: bloom OFF, bg-veil OFF, brightness 100%.
        (function ()
        {
            if (!/[?&]fx(?:[=&]|$)/.test(window.location.search || "")) return;
            var fx = { bloom: 0, veil: 0, brightness: 1 };

            function send(k, v)
            {
                try { DotNet.invokeMethod('EvilAliensWeb', 'debugFx', String(k), Number(v)); return true; }
                catch (e) { return false; }
            }
            function pushAll()
            {
                // Retry until the .NET runtime is up, then push the initial state.
                if (!send('bloom', fx.bloom)) { setTimeout(pushAll, 200); return; }
                send('veil', fx.veil); send('brightness', fx.brightness);
            }

            function build()
            {
                var p = document.createElement('div');
                p.id = 'ea-fx';
                p.style.cssText = 'position:fixed;top:54px;right:8px;z-index:99999;background:rgba(8,6,16,.82);' +
                    'border:1px solid #3a3550;border-radius:8px;padding:8px;font:12px/1.3 monospace;color:#e8e6f2;' +
                    'user-select:none;min-width:154px;box-shadow:0 2px 12px rgba(0,0,0,.5)';
                p.innerHTML = '<div style="font-weight:bold;letter-spacing:1px;margin-bottom:6px;opacity:.8">FX PANEL</div>';

                function mkToggle(key, label)
                {
                    var b = document.createElement('button');
                    b.style.cssText = 'display:block;width:100%;margin:3px 0;padding:5px 8px;border-radius:5px;' +
                        'border:1px solid #444;cursor:pointer;font:inherit;text-align:left';
                    function paint()
                    {
                        var on = !!fx[key];
                        b.style.background = on ? '#2e7d32' : '#2a2733';
                        b.style.color = on ? '#fff' : '#9a96aa';
                        b.style.borderColor = on ? '#43a047' : '#444';
                        b.textContent = (on ? '● ' : '○ ') + label;
                    }
                    b.onclick = function () { fx[key] = fx[key] ? 0 : 1; send(key, fx[key]); paint(); };
                    paint(); p.appendChild(b);
                }
                mkToggle('bloom', 'Bloom');
                mkToggle('veil', 'BG dark veil');

                var row = document.createElement('div');
                row.style.cssText = 'margin-top:6px;border-top:1px solid #3a3550;padding-top:6px';
                row.innerHTML = '<div style="opacity:.8;margin-bottom:3px">Starfield brightness</div>';
                var wrap = document.createElement('div');
                wrap.style.cssText = 'display:flex;gap:3px';
                [['30%', 0.3], ['50%', 0.5], ['75%', 0.75], ['100%', 1]].forEach(function (o)
                {
                    var b = document.createElement('button');
                    b.textContent = o[0];
                    b.style.cssText = 'flex:1;padding:5px 0;border-radius:5px;border:1px solid #444;cursor:pointer;font:inherit';
                    function paint()
                    {
                        var on = Math.abs(fx.brightness - o[1]) < 0.001;
                        b.style.background = on ? '#1565c0' : '#2a2733';
                        b.style.color = on ? '#fff' : '#9a96aa';
                        b.style.borderColor = on ? '#1e88e5' : '#444';
                    }
                    b.onclick = function ()
                    {
                        fx.brightness = o[1]; send('brightness', fx.brightness);
                        Array.prototype.forEach.call(wrap.children, function (c) { c._paint && c._paint(); });
                    };
                    b._paint = paint; paint(); wrap.appendChild(b);
                });
                row.appendChild(wrap); p.appendChild(row);
                document.body.appendChild(p);
                pushAll();
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
            else build();
        })();
    </script>

    <script>
        // ----- eaMusic: WebAudio background-music layer (Stage 6) -------------
        // Music needs seamless loop POINTS (intro -> looping body, or a
        // pymusiclooper seam), which KNI's whole-buffer SoundEffect looping can't
        // do. Tracks + loop points live in Content/music/music.json; C# drives
        // this via MusicInterop (eaMusic.play/stop/setRate). SFX stay on KNI.
        window.eaMusic = (function ()
        {
            var ctx = null, master = null, muffle = null;
            var manifest = null, manifestPromise = null;
            var started = false;     // AudioContext unlocked by a user gesture?
            var pending = null;      // track requested before unlock
            var current = null;      // { cue, src, gain }
            var token = 0;           // newer play() supersedes in-flight loads
            var curRate = 1;

            // Pause "underwater" muffle knobs. The whole music bus runs through a
            // lowpass filter that's wide open in play (inaudible) and clamps down to
            // MUFFLE_ON_HZ while the game is paused, plus a master duck — so the BGM
            // goes quiet + muddy, then springs back on resume (setMuffle below).
            var BASE_MASTER = 0.55;
            var MUFFLE_OPEN_HZ = 20000;   // effectively no filtering
            var MUFFLE_ON_HZ = 320;       // muddy/submerged cutoff when paused
            var MUFFLE_DUCK = 0.5;        // master gain multiplier while paused
            var MUFFLE_RAMP = 0.3;        // setTargetAtTime time constant (seconds)

            // ?mute (DebugFlags.Mute -> MusicInterop.SetMute). Muffle and mute BOTH want the
            // master gain, so neither may write it directly -- they are tracked as separate
            // state and composed by masterTarget(), or whichever ran last would clobber the
            // other (unmuting mid-pause would come back at full volume, and a pause-enter
            // while muted would un-silence the bus).
            var muted = false;
            var muffled = false;

            function masterTarget()
            {
                if (muted) return 0;
                return muffled ? BASE_MASTER * MUFFLE_DUCK : BASE_MASTER;
            }

            function ensureCtx()
            {
                if (ctx) return;
                var AC = window.AudioContext || window.webkitAudioContext;
                ctx = new AC();
                master = ctx.createGain();
                // masterTarget(), not BASE_MASTER: ?mute is applied at boot, which can land
                // before any audio unlocks -- a literal here would come up at full volume on
                // the first gesture and silently ignore the flag.
                master.gain.value = masterTarget();
                // Lowpass on the master bus for the pause muffle. Open by default so a
                // non-paused game is bit-identical to the pre-filter bus; setMuffle()
                // rides its cutoff + the master duck. Q 0.7 = a gentle rolloff (no
                // resonant peak), which reads as "submerged" rather than "telephone".
                muffle = ctx.createBiquadFilter();
                muffle.type = "lowpass";
                muffle.frequency.value = MUFFLE_OPEN_HZ;
                muffle.Q.value = 0.7;
                master.connect(muffle);
                muffle.connect(ctx.destination);
            }

            function loadManifest()
            {
                if (!manifestPromise)
                    manifestPromise = fetch("Content/music/music.json")
                        .then(function (r) { return r.json(); })
                        .then(function (m) { manifest = m; return m; })
                        .catch(function (e)
                        {
                            // The promise is CACHED, so this resolves {} once and every cue for
                            // the rest of the session then takes the "no entry" branch below --
                            // a third silent failure wearing the second one's message. Say which
                            // it really is (card 4a3b22b7).
                            console.warn("[music] music.json could not be loaded ("
                                + (e && e.message ? e.message : e) + ") -- no cue can resolve");
                            manifest = {}; return {};
                        });
                return manifestPromise;
            }

            // Authored Music category (alienssfx.xgs): ReplaceOldest with 2.5s
            // fadeIn/fadeOut, so a cue change crossfades over 2.5s.
            var MUSIC_FADE = 2.5;

            function fadeOut(entry)
            {
                if (!entry) return;
                var t = ctx.currentTime;
                // Drop any ramp still queued on this node (e.g. its own fade-in to
                // 0.6 if we're crossfading it out mid-rise) — else WebAudio replays
                // that event in time order and the dying track audibly swells first.
                // Read the LIVE gain BEFORE the cancel: cancelScheduledValues drops the
                // pending ramp and .value then recomputes from the remaining timeline
                // (the initial setValueAtTime(0.0001,...)), so reading it after would
                // snap a mid-fade-in track to ~0 and cut it instead of fading.
                var v = entry.gain.gain.value;
                entry.gain.gain.cancelScheduledValues(t);
                entry.gain.gain.setValueAtTime(v, t);
                entry.gain.gain.linearRampToValueAtTime(0.0001, t + MUSIC_FADE);
                try { entry.src.stop(t + MUSIC_FADE + 0.05); } catch (e) { }
            }

            function startTrack(cue)
            {
                ensureCtx();
                // Claim the load slot SYNCHRONOUSLY. Keeping the token bookkeeping inside
                // the async loadManifest().then below would race: a stop() or a newer
                // play() that fires before this callback runs bumps token, but if myToken
                // was not yet assigned the stale load still passes its guard and wins.
                // (Bumping on the "already on it" path supersedes any in-flight load for a
                // different cue, so play(A)->play(B,in flight)->play(A) keeps A, not B.)
                if (current && current.cue === cue)
                {
                    token++;                                  // already on it
                    // play() reset curRate to 1, but a prior setRate sweep (Level3/
                    // BrainBoss) left the live node at the swept rate — re-assert the
                    // intended rate so the node and curRate agree (matches setRate below).
                    if (ctx) { try { current.src.playbackRate.setTargetAtTime(curRate, ctx.currentTime, 0.05); } catch (e) { } }
                    return;
                }
                var myToken = ++token;
                loadManifest().then(function (m)
                {
                    if (myToken !== token) return;            // superseded before manifest resolved
                    var info = m[cue];
                    // Card 4a3b22b7: both this and the catch below used to be SILENT, and either
                    // one leaves the PREVIOUS track playing with nothing said -- indistinguishable,
                    // from outside, from the game never asking for the switch. Pair the [music]
                    // line C# prints on the request with one here when the request cannot be
                    // honoured, so "the music did not change" always names its half.
                    if (!info)
                    {
                        console.warn("[music] no music.json entry for cue '" + cue + "' -- previous track keeps playing");
                        return;
                    }
                    fetch(encodeURI(info.file)).then(function (resp)
                    {
                        // `throw 0` here until card 4a3b22b7: the catch below renders it as the
                        // literal "0", so a 404 on a track reported no status at all -- which is
                        // the very thing the catch was added to name.
                        if (!resp.ok) throw new Error("HTTP " + resp.status);
                        return resp.arrayBuffer();
                    }).then(function (ab)
                    {
                        return ctx.decodeAudioData(ab);
                    }).then(function (buf)
                    {
                        if (myToken !== token) return;            // superseded
                        fadeOut(current); current = null;
                        var src = ctx.createBufferSource();
                        src.buffer = buf;
                        src.loop = true;
                        if (info.loopEnd > info.loopStart)
                        {
                            src.loopStart = info.loopStart;       // seconds
                            src.loopEnd = info.loopEnd;
                        }
                        src.playbackRate.value = curRate;
                        var g = ctx.createGain();
                        // Fade the new track in over the authored 2.5s (crossfades
                        // against the outgoing track's matching fadeOut). g is a fresh
                        // node with no prior schedule, so no cancelScheduledValues needed.
                        var t0 = ctx.currentTime;
                        g.gain.setValueAtTime(0.0001, t0);
                        g.gain.linearRampToValueAtTime(0.6, t0 + MUSIC_FADE);
                        src.connect(g).connect(master);
                        src.start();
                        current = { cue: cue, src: src, gain: g };
                    }).catch(function (e)
                    {
                        // Music is non-fatal and stays non-fatal -- but a failed fetch/decode is
                        // reported now (see the manifest branch above). For the fetch/decode
                        // failures this exists for, `current` has not been touched yet, so the OLD
                        // track simply keeps playing forever; a throw AFTER the swap above would
                        // land here with `current` already null, i.e. silence rather than a stale
                        // track. The wording covers the common case and the message says which
                        // cue, so either way it is attributable.
                        console.warn("[music] could not load cue '" + cue + "' (" + (info && info.file) + "): "
                            + (e && e.message ? e.message : e) + " -- previous track keeps playing");
                    });
                });
            }

            function kick()
            {
                if (started) return;
                started = true;
                ensureCtx();
                ctx.resume().then(function ()
                {
                    if (pending) { var c = pending; pending = null; startTrack(c); }
                });
                window.removeEventListener("keydown", kick);
                window.removeEventListener("pointerdown", kick);
            }
            window.addEventListener("keydown", kick);
            window.addEventListener("pointerdown", kick);

            return {
                // Explicit unlock for flows whose join gesture never reaches the window
                // kick listeners — notably the webcam setup dialog, which swallows the
                // Enter keydown (stopImmediatePropagation) so "press Enter to join" would
                // otherwise leave the AudioContext suspended and the level's music silent.
                // Safe to call anytime: kick() is idempotent and only unlocks from within
                // the caller's own user-activation context.
                unlock: function () { kick(); },
                play: function (cue)
                {
                    curRate = 1;
                    if (!started) { pending = cue; return; }
                    // Once unlocked, this play() is the live intent — clear any cue that
                    // was queued pre-gesture so the unlocking ctx.resume() callback can't
                    // later start it and supersede us (play(A)-pre-unlock -> gesture ->
                    // play(B)-in-window would otherwise still hear A win).
                    pending = null;
                    startTrack(cue);
                },
                stop: function ()
                {
                    pending = null;
                    curRate = 1;
                    // Supersede any load still in flight so it can't start looping
                    // after we've stopped (cold fetch+decode takes seconds).
                    token++;
                    if (current) { fadeOut(current); current = null; }
                },
                // pause/resume suspend the AudioContext clock, so the track resumes
                // from the exact same sample (seamless) — used while a trailer overlay
                // is up so its audio isn't fighting the menu music (Stage 14).
                pause: function () { if (ctx && started) { try { ctx.suspend(); } catch (e) { } } },
                resume: function () { if (ctx && started) { try { ctx.resume(); } catch (e) { } } },
                // Pause "underwater" muffle: ramp the master lowpass cutoff down (muddy)
                // and duck the master gain while the game is paused; both spring back on
                // resume. Independent of pause()/setRate() (filter vs suspend vs
                // playbackRate), so the trailer suspend and the BrainBoss rate sweep are
                // unaffected. No-op before audio unlocks (a pause can't precede gameplay).
                setMuffle: function (on)
                {
                    muffled = !!on;
                    if (!ctx || !muffle) return;
                    var t = ctx.currentTime;
                    muffle.frequency.cancelScheduledValues(t);
                    muffle.frequency.setTargetAtTime(on ? MUFFLE_ON_HZ : MUFFLE_OPEN_HZ, t, MUFFLE_RAMP);
                    master.gain.cancelScheduledValues(t);
                    master.gain.setTargetAtTime(masterTarget(), t, MUFFLE_RAMP);
                },
                // ?mute -- silence the music bus. Gain only: the track keeps playing (and
                // keeps its loop position and rate sweep), so unmuting is seamless and the
                // muted run measures the same work an audible one does. Ramped like the
                // muffle rather than a hard set, so toggling it live can't click.
                // State is kept even with no ctx, so a boot-time mute survives to ensureCtx.
                setMute: function (on)
                {
                    muted = !!on;
                    if (!ctx || !master) return;
                    var t = ctx.currentTime;
                    master.gain.cancelScheduledValues(t);
                    master.gain.setTargetAtTime(masterTarget(), t, 0.05);
                },
                setRate: function (rate)
                {
                    // `rate` is already the AudioBufferSourceNode.playbackRate: the C#
                    // side (MusicInterop) applies the authored XACT Pitch RPC curve.
                    curRate = Math.max(0.25, rate);
                    if (current && ctx)
                    {
                        try { current.src.playbackRate.setTargetAtTime(curRate, ctx.currentTime, 0.05); }
                        catch (e) { }
                    }
                }
            };
        })();
    </script>

    <script>
        // ----- eaSaveBlob: IndexedDB store for the large screenshot (.dat) blobs ----
        // localStorage (~5MB/origin) is too small for the level-select screenshots
        // (~360KB base64 each x up to 12 challenges = ~4.3MB, near the cap). Move those
        // blobs to IndexedDB (hundreds of MB quota) while the small settings/unlockables/
        // awardments XML stays in localStorage (eaSave). IndexedDB is async but the game
        // reads saves synchronously, so preload() pulls every blob into an in-memory map
        // at boot (awaited by initRenderJS before the first tick), and getAll() serves
        // that map synchronously to the C# hydrate. It also MIGRATES any .dat older builds
        // left in localStorage. If IndexedDB is unavailable (private mode / disabled),
        // available() stays false and eaSave falls back to the pre-migration localStorage
        // path, so behaviour only ever degrades to what shipped before.
        window.eaSaveBlob = (function ()
        {
            var DB = "eaweb_save", STORE = "screenshots", PREFIX = "eaweb_save:";
            var _cache = {};        // relpath -> base64, populated by preload()
            var _db = null;
            var _available = false;

            function openDb()
            {
                return new Promise(function (resolve, reject)
                {
                    var req;
                    try { req = indexedDB.open(DB, 1); }
                    catch (e) { reject(e); return; }
                    req.onupgradeneeded = function ()
                    {
                        var db = req.result;
                        if (!db.objectStoreNames.contains(STORE))
                            db.createObjectStore(STORE);   // out-of-line keys = the relpath string
                    };
                    req.onsuccess = function () { resolve(req.result); };
                    req.onerror = function () { reject(req.error); };
                    req.onblocked = function () { reject(new Error("indexedDB.open blocked")); };
                });
            }

            function store(mode) { return _db.transaction(STORE, mode).objectStore(STORE); }

            function idbGetAll()
            {
                return new Promise(function (resolve)
                {
                    var out = {};
                    try
                    {
                        var cur = store("readonly").openCursor();
                        cur.onsuccess = function ()
                        {
                            var c = cur.result;
                            if (c) { out[c.key] = c.value; c.continue(); }
                            else resolve(out);
                        };
                        cur.onerror = function () { resolve(out); };
                    }
                    catch (e) { resolve(out); }
                });
            }

            // Move any .dat blobs older builds wrote to localStorage into IndexedDB, then
            // drop them from localStorage to reclaim the ~5MB budget. One-time; a no-op once
            // done (no .dat keys remain in localStorage).
            function migrateFromLocalStorage()
            {
                var moved = [];
                try
                {
                    for (var i = 0; i < localStorage.length; i++)
                    {
                        var k = localStorage.key(i);
                        if (k && k.indexOf(PREFIX) === 0 && k.slice(-4) === ".dat")
                            moved.push(k);
                    }
                }
                catch (e) { return Promise.resolve(); }
                if (!moved.length) return Promise.resolve();
                return new Promise(function (resolve)
                {
                    try
                    {
                        var t = _db.transaction(STORE, "readwrite");
                        var s = t.objectStore(STORE);
                        moved.forEach(function (k)
                        {
                            var name = k.substring(PREFIX.length);
                            var val = localStorage.getItem(k);
                            if (val != null) { s.put(val, name); _cache[name] = val; }
                        });
                        t.oncomplete = function ()
                        {
                            // Only drop the localStorage copies once the IDB write committed.
                            moved.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) { } });
                            console.log("[eaSaveBlob] migrated " + moved.length + " screenshot(s) from localStorage to IndexedDB");
                            resolve();
                        };
                        t.onerror = function () { resolve(); };   // leave localStorage copies if the move failed
                    }
                    catch (e) { resolve(); }
                });
            }

            return {
                available: function () { return _available; },
                // Open the DB, load every blob into _cache, then migrate localStorage .dat.
                // Raced against a timeout so a wedged IndexedDB open (blocked event, browser
                // bug) can NEVER hang initRenderJS / the first game tick: on timeout the
                // session falls back to localStorage mode (timedOut makes a late open a
                // no-op, so the mode can't flip mid-session; blobs already in IndexedDB
                // simply reappear next session — no data loss).
                preload: function ()
                {
                    var timedOut = false;
                    var work = openDb().then(function (db)
                    {
                        if (timedOut) { try { db.close(); } catch (e) { } return; }
                        _db = db;
                        return idbGetAll().then(function (all)
                        {
                            if (timedOut) return;
                            _cache = all || {};
                            _available = true;
                            return migrateFromLocalStorage();
                        });
                    }).catch(function (e)
                    {
                        _available = false; _cache = {};
                        console.warn("[eaSaveBlob] IndexedDB unavailable; screenshots stay in localStorage", e);
                    });
                    var gate = new Promise(function (resolve)
                    {
                        setTimeout(function ()
                        {
                            if (!_available)
                            {
                                timedOut = true;
                                console.warn("[eaSaveBlob] IndexedDB slow to open; booting with localStorage screenshots");
                            }
                            resolve();
                        }, 3000);
                    });
                    return Promise.race([work, gate]);
                },
                // Synchronous snapshot for the C# hydrate (name -> base64).
                getAll: function () { return _cache; },
                // Best-effort async write; updates _cache synchronously and returns true
                // optimistically (screenshots are non-critical and IDB quota is huge).
                set: function (name, b64)
                {
                    if (!_available) return false;
                    _cache[name] = b64;
                    try { store("readwrite").put(b64, name); }
                    catch (e) { console.warn("[eaSaveBlob] put failed for " + name, e); return false; }
                    return true;
                },
                remove: function (name)
                {
                    delete _cache[name];
                    if (!_available) return;
                    try { store("readwrite").delete(name); } catch (e) { }
                }
            };
        })();

        // ----- eaSave: localStorage persistence for the save tree (Stage 7) ----
        // The game writes settings / unlockables / awardments / level screenshots
        // to the in-memory WASM filesystem (StorageStub.cs). This mirrors that tree
        // so it survives a reload; C# drives it via SaveInterop. Keys are
        // "eaweb_save:<relpath>" (e.g. eaweb_save:EvilAliens/Settings.xml); values are
        // base64 of the raw file bytes. BACKEND SPLIT: the large screenshot ".dat" blobs
        // go to IndexedDB (eaSaveBlob, big quota) and the small XML stays in localStorage;
        // when IndexedDB is unavailable, .dat falls back to localStorage (the old path).
        window.eaSave = (function ()
        {
            var PREFIX = "eaweb_save:";
            var isBlob = function (name) { return name.slice(-4) === ".dat" && window.eaSaveBlob.available(); };
            return {
                // Returns JSON { "<relpath>": "<base64>", ... } for every entry, merging the
                // localStorage XML (+ any un-migrated .dat) with the IndexedDB screenshot blobs.
                load: function ()
                {
                    var out = {};
                    try
                    {
                        for (var i = 0; i < localStorage.length; i++)
                        {
                            var k = localStorage.key(i);
                            if (k && k.indexOf(PREFIX) === 0)
                                out[k.substring(PREFIX.length)] = localStorage.getItem(k);
                        }
                    }
                    catch (e) { console.warn("eaSave.load failed", e); }
                    try
                    {
                        var blobs = window.eaSaveBlob.getAll();
                        for (var name in blobs)
                            if (Object.prototype.hasOwnProperty.call(blobs, name)) out[name] = blobs[name];
                    }
                    catch (e) { console.warn("eaSave.load blobs failed", e); }
                    return JSON.stringify(out);
                },
                // Returns false if it didn't stick (quota / disabled storage), so C#
                // keeps the file dirty and retries on the next save.
                set: function (name, b64)
                {
                    if (isBlob(name)) return window.eaSaveBlob.set(name, b64);
                    try { localStorage.setItem(PREFIX + name, b64); return true; }
                    catch (e)
                    {
                        console.warn("eaSave: could not persist " + name + " (quota?)", e);
                        return false;
                    }
                },
                remove: function (name)
                {
                    if (name.slice(-4) === ".dat") window.eaSaveBlob.remove(name);
                    try { localStorage.removeItem(PREFIX + name); } catch (e) { }
                }
            };
        })();

        // ----- eaLoadProfile: localStorage-backed texture-load profile (debug) -----
        // The C# LoadProfiler (Compat/LoadProfiler.cs, enabled by ?loadlog) records
        // which textures decode in which level and whether they were preloaded; it
        // mirrors that here so the data accumulates across reloads, and the level
        // preloader reads it back so a gap hit last run is warm this run. One key, a
        // plain-text manifest. download() saves it as a file to commit; release builds
        // never call save() (RecordTexture is a no-op without ?loadlog).
        window.eaLoadProfile = (function ()
        {
            var KEY = "eaweb_loadprofile";
            return {
                load: function () { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } },
                save: function (text)
                {
                    try { localStorage.setItem(KEY, text); return true; }
                    catch (e) { console.warn("eaLoadProfile.save failed (quota?)", e); return false; }
                },
                clear: function () { try { localStorage.removeItem(KEY); } catch (e) { } },
                download: function (name, text)
                {
                    try
                    {
                        var blob = new Blob([text], { type: "text/plain" });
                        var a = document.createElement("a");
                        a.href = URL.createObjectURL(blob);
                        a.download = name || "preload_manifest.txt";
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
                    }
                    catch (e) { console.warn("eaLoadProfile.download failed", e); }
                }
            };
        })();

        // Console helper: dump + download the accumulated preload manifest. Returns
        // the text too, so `eaPreloadExport()` prints it inline. No-op data if ?loadlog
        // wasn't set this session.
        window.eaPreloadExport = function ()
        {
            try { return DotNet.invokeMethod("EvilAliensWeb", "ExportPreloadManifest"); }
            catch (e) { console.warn("eaPreloadExport failed (game not ready?)", e); return ""; }
        };
    </script>

    <!-- Live colorize-tuner slider panel for the ?harness=battleskull page (card 632d4cf7).
         The BattleSkull "lightbulb" boss hue tuner was URL-flag only, so every nudge meant a
         full page reload. This overlay drives Compat/DebugInput.SetHue (via eaHue) so the band
         [start,end] + Target hue can be DRAGGED in real time. Built outside #app so it survives
         Blazor's mount, and only created on the battleskull harness — a normal boot gets no
         extra DOM and stays byte-identical. Positioned top-right (the game draws its own readout
         top-left). -->
    <script>
        (function ()
        {
            var q = window.location.search || "";
            if (!/[?&]harness=battleskull\b/i.test(q)) { return; }

            // Seed the sliders from any ?hue* flags already on the URL, else the in-game coded
            // defaults: band (-10,10) and the full-HP green Target (100).
            function num(name, def)
            {
                var m = new RegExp("[?&]" + name + "=(-?[0-9.]+)", "i").exec(q);
                return m ? parseFloat(m[1]) : def;
            }
            var urlCycle = /[?&](huecycle|huesweep)\b/i.test(q);
            var urlTarget = /[?&](huetarget|hue)=/i.test(q);
            var st = {
                start: num("huestart", -10),
                end: num("hueend", 10),
                target: num("huetarget", num("hue", 100)),
                trackHp: !urlTarget && !urlCycle,   // pin the Target only if the URL did
                cycle: urlCycle,
                loop: num("hueloop", 6)
            };

            // Push the current state into the game. Returns false (and is retried) until the
            // .NET runtime is up — eaHue swallows the pre-boot throw, so we call DotNet directly.
            function push()
            {
                try
                {
                    DotNet.invokeMethod('EvilAliensWeb', 'debugSetHue',
                        st.start, st.end, st.target, st.trackHp, st.cycle, st.loop);
                    return true;
                }
                catch (e) { return false; }
            }

            var css = document.createElement("style");

            // launch-X marker / the dialed shadow (37,4) x0.95 / dialed air offset (14,1). Launch X is
            // RANDOM per spider by default (exactly like shipped play), unless the URL pins it with
            // ?spiderjumpx=; TICK "Pin launch X" only for repeatable dialing.
            function num(name, def)

            }
            var st = {
                jumpFrame: num("spiderjumpframe", 5),

            // Push the current state into the game. Returns false (and is retried) until the .NET
            // runtime is up — eaSpider swallows the pre-boot throw, so we call DotNet directly.
            function push()
            {
                try

                        st.jumpFrame, st.landFrame, st.jumpX, st.pinX,

            var css = document.createElement("style");

                "#ea-spider .v{font-variant-numeric:tabular-nums;color:#9ffcd0;font-weight:600}" +
                "#ea-spider input[type=range]{width:100%;margin:3px 0 0;accent-color:#7bd06f}" +
                "#ea-spider .chk{display:flex;align-items:center;gap:6px;margin:6px 0;cursor:pointer}" +

            document.head.appendChild(css);

            var el = document.createElement("div");
            el.id = "ea-spider";
            el.innerHTML =

                "<input type='range' id='es-ax' min='-80' max='80' step='1' autocomplete='off'></div>" +
                "<div class='row'><label>Air offset Y (up = neg)<span class='v' id='es-vay'></span></label>" +
                "<input type='range' id='es-ay' min='-140' max='60' step='1' autocomplete='off'></div>" +
                "<div class='row' id='es-xrow'><label>Launch X<span class='v' id='es-vjx'></span></label>" +
                "<input type='range' id='es-jx' min='0' max='800' step='5' autocomplete='off'></div>" +
                "<label class='chk'><input type='checkbox' id='es-pin' checked> Pin launch X (else random)</label>" +
                "<div class='row'><label>Shadow X<span class='v' id='es-vsx'></span></label>" +
                "<input type='range' id='es-sx' min='-120' max='120' step='1' autocomplete='off'></div>" +
                "<div class='row'><label>Shadow Y<span class='v' id='es-vsy'></span></label>" +

                "<div class='hint'>Drag to retune live (harness = instant; the ?spiders wave applies to " +

                "across it. Click the orange line to copy, then paste to Claude to bake in.</div>";
            document.body.appendChild(el);

            var elFrz = el.querySelector("#es-frz"), elPh = el.querySelector("#es-ph"),
                elPhrow = el.querySelector("#es-phrow"), vph = el.querySelector("#es-vph"),

                elAx = el.querySelector("#es-ax"), elAy = el.querySelector("#es-ay"),

                elXrow = el.querySelector("#es-xrow"),
                elSx = el.querySelector("#es-sx"), elSy = el.querySelector("#es-sy"),
                elSs = el.querySelector("#es-ss"), elOut = el.querySelector("#es-out"),
                vjf = el.querySelector("#es-vjf"), vlf = el.querySelector("#es-vlf"),
                vax = el.querySelector("#es-vax"), vay = el.querySelector("#es-vay"),
                vjx = el.querySelector("#es-vjx"), vsx = el.querySelector("#es-vsx"),
                vsy = el.querySelector("#es-vsy"), vss = el.querySelector("#es-vss");

            function render()
            {
                elFrz.checked = st.freeze; elPh.value = st.phase; vph.textContent = st.phase;
                elPhrow.classList.toggle("dim", !st.freeze); elPh.disabled = !st.freeze;
                elJf.value = st.jumpFrame; elLf.value = st.landFrame; elJx.value = st.jumpX;
                elAx.value = st.airX; elAy.value = st.airY; elPin.checked = st.pinX;

                var flags = "spiderjumpframe=" + st.jumpFrame + " spiderlandframe=" + st.landFrame;
                if (st.pinX) { flags += " spiderjumpx=" + st.jumpX; }
                flags += " spidershadowx=" + st.shadowX + " spidershadowy=" + st.shadowY +
                    " spidershadowscale=" + st.shadowScale +

            function changed() { render(); push(); }

            elFrz.addEventListener("change", function () { st.freeze = elFrz.checked; changed(); });
            elPh.addEventListener("input", function () { st.phase = +elPh.value; changed(); });
            elJf.addEventListener("input", function () { st.jumpFrame = +elJf.value; changed(); });
            elLf.addEventListener("input", function () { st.landFrame = +elLf.value; changed(); });
            elAx.addEventListener("input", function () { st.airX = +elAx.value; changed(); });
            elAy.addEventListener("input", function () { st.airY = +elAy.value; changed(); });
            elJx.addEventListener("input", function () { st.jumpX = +elJx.value; changed(); });
            elPin.addEventListener("change", function () { st.pinX = elPin.checked; changed(); });
            elSx.addEventListener("input", function () { st.shadowX = +elSx.value; changed(); });

            elSs.addEventListener("input", function () { st.shadowScale = +elSs.value; changed(); });

            }
        })();
