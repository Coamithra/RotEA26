    <!-- eaNetSim: live network-impairment panel (card 40334a8f). BroadcastChannelTransport
         delivers both lanes reliably and in order, so every drop-tolerance path cards 11.1-11.3
         built (interpolation underrun, the snapshot self-heal, the claim ledgers, the peer
         timeout) had never actually executed. These knobs make packets go missing on demand.
         Drives Compat/DebugInput.SetNetSim -> NetImpairment, which wraps the transport behind
         INetTransport and so impairs the WebRTC transport (card 11.4) unchanged. Built outside
         #app, and only when a ?net boot also passes ?netsim — a bare ?net= boot gets just the
         eaNetSim console entry points, and a normal boot no extra DOM and no extra globals. -->
    <script>
        (function ()
        {
            var q = window.location.search || "";
            if (!/[?&]net=(host|join|client)\b/i.test(q)) { return; }

            // The PANEL is opt-in (?netsim). It parks over the top-right corner of a co-op
            // session you are usually trying to WATCH, and most ?net= boots never impair
            // anything — so without the flag nothing is added to the DOM. The console entry
            // points below still exist on any ?net= boot, and eaNetSim.show() builds the
            // panel on demand. The knobs themselves are unaffected: ?netlag=/?netloss= are
            // parsed C#-side in DebugFlags, so they impair with or without this panel.
            var wantPanel = /[?&]netsim\b/i.test(q);

            function num(name, def)
            {
                var m = new RegExp("[?&]" + name + "=(-?[0-9.]+)", "i").exec(q);
                return m ? parseFloat(m[1]) : def;
            }
            function clamp(v, lo, hi) { return isNaN(v) ? lo : Math.min(hi, Math.max(lo, v)); }

            // Seeded from ?netlag=/?netloss= if present. Jitter has no URL flag by design — it
            // is the knob that makes the stream lane actually REORDER, and it lives here next
            // to the other two rather than in a boot URL.
            // CLAMPED to the slider bounds on the way in: C# clamps to the same maxima, so an
            // unclamped ?netlag=9999 would print "9999 ms" in the label and the copy line while
            // 500 was actually in force — a readout that lies is worse than no readout.
            var st = {
                lag: clamp(num("netlag", 0), 0, 500),
                loss: clamp(num("netloss", 0), 0, 100),
                jitter: 0
            };

            function push()
            {
                try
                {
                    DotNet.invokeMethod('EvilAliensWeb', 'debugSetNetSim', st.lag, st.loss, st.jitter);
                    return true;
                }
                catch (e) { return false; }
            }

            var el = null, elLag, elLoss, elJit, elOut, elRes, elTest, vlag, vloss, vjit;

            function buildPanel()
            {
                if (el) { el.style.display = ""; return; }

                var css = document.createElement("style");
                css.textContent =
                    "#ea-netsim{position:fixed;top:10px;right:10px;z-index:99999;width:262px;" +
                    "font:12px/1.35 system-ui,Segoe UI,sans-serif;color:#e8e8f0;" +
                    "background:rgba(10,8,20,.82);border:1px solid rgba(150,180,220,.35);" +
                    "border-radius:8px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.5);" +
                    "-webkit-user-select:none;user-select:none;backdrop-filter:blur(2px)}" +
                    "#ea-netsim h4{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.02em;" +
                    "color:#b8d8e8}" +
                    "#ea-netsim .row{margin:7px 0}" +
                    "#ea-netsim label{display:flex;justify-content:space-between;align-items:baseline}" +
                    "#ea-netsim .v{font-variant-numeric:tabular-nums;color:#9ffcd0;font-weight:600}" +
                    "#ea-netsim input[type=range]{width:100%;margin:3px 0 0;accent-color:#6fa8d0}" +
                    "#ea-netsim button{width:100%;margin-top:8px;padding:5px 8px;font:11px/1.2 inherit;" +
                    "color:#e8e8f0;background:rgba(110,150,200,.25);border:1px solid rgba(150,180,220,.4);" +
                    "border-radius:5px;cursor:pointer}" +
                    "#ea-netsim button:hover{background:rgba(110,150,200,.4)}" +
                    "#ea-netsim .out{margin-top:9px;padding-top:8px;border-top:1px solid rgba(150,180,220,.25);" +
                    "font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#ffd98f;" +
                    "word-break:break-all;cursor:pointer}" +
                    "#ea-netsim .res{margin-top:6px;font-family:ui-monospace,Consolas,monospace;" +
                    "font-size:10px;color:#9ffcd0;word-break:break-all;line-height:1.35}" +
                    "#ea-netsim .hint{margin-top:6px;font-size:10px;color:#8a86a0;line-height:1.3}";
                document.head.appendChild(css);

                el = document.createElement("div");
                el.id = "ea-netsim";
                el.innerHTML =
                    "<h4>Network impairment (inbound)</h4>" +
                    "<div class='row'><label>Lag<span class='v' id='ns-vlag'></span></label>" +
                    "<input type='range' id='ns-lag' min='0' max='500' step='5' autocomplete='off'></div>" +
                    "<div class='row'><label>Packet loss (stream lane)<span class='v' id='ns-vloss'></span></label>" +
                    "<input type='range' id='ns-loss' min='0' max='100' step='1' autocomplete='off'></div>" +
                    "<div class='row'><label>Jitter &plusmn; (session only)<span class='v' id='ns-vjit'></span></label>" +
                    "<input type='range' id='ns-jit' min='0' max='200' step='5' autocomplete='off'></div>" +
                    "<button id='ns-test'>Self-test (200 packets/lane)</button>" +
                    "<div class='res' id='ns-res'></div>" +
                    "<div class='out' id='ns-out' title='Click to copy'></div>" +
                    "<div class='hint'>Applies to INBOUND traffic only — the peer's link looks bad from " +
                    "here. The reliable lane is delayed but never dropped or reordered. Loss 100% starves " +
                    "the ship stream, so the stall banner goes up after ~1.2s and the drop verdict lands ~8s in: that is the simulated silent " +
                    "disconnect, not a bug. Watch the 5s [net] line: extrap/pops/sgap should climb and " +
                    "settle back at 0/0.</div>";
                document.body.appendChild(el);

                elLag = el.querySelector("#ns-lag"); elLoss = el.querySelector("#ns-loss");
                elJit = el.querySelector("#ns-jit"); elOut = el.querySelector("#ns-out");
                elRes = el.querySelector("#ns-res"); elTest = el.querySelector("#ns-test");
                vlag = el.querySelector("#ns-vlag"); vloss = el.querySelector("#ns-vloss");
                vjit = el.querySelector("#ns-vjit");

                elLag.addEventListener("input", function () { st.lag = +elLag.value; changed(); });
                elLoss.addEventListener("input", function () { st.loss = +elLoss.value; changed(); });
                elJit.addEventListener("input", function () { st.jitter = +elJit.value; changed(); });
                elOut.addEventListener("click", function ()
                {
                    var t = elOut.textContent;
                    if (navigator.clipboard) { navigator.clipboard.writeText(t).catch(function () { }); }
                    var old = elOut.style.color; elOut.style.color = "#9ffcd0";
                    setTimeout(function () { elOut.style.color = old; }, 250);
                });
                elTest.addEventListener("click", function () { window.eaNetSim.test(st.lag, st.loss, st.jitter, 200); });

                render();
                // Retry until the .NET runtime is up — but BOUNDED. push() swallows every exception,
                // so an unbounded retry would spin silently forever on a genuine SetNetSim failure
                // instead of ever saying so. ~24s is far past a cold WASM boot.
                if (!push())
                {
                    var tries = 0;
                    var iv = setInterval(function ()
                    {
                        if (push()) { clearInterval(iv); return; }
                        if (++tries >= 60)
                        {
                            clearInterval(iv);
                            console.warn('[netsim] gave up pushing impairment settings after ' + tries
                                + ' attempts — debugSetNetSim is failing, not just waiting for boot');
                        }
                    }, 400);
                }
            }

            function render()
            {
                if (!el) { return; }

                elLag.value = st.lag; elLoss.value = st.loss; elJit.value = st.jitter;
                vlag.textContent = st.lag + " ms";
                vloss.textContent = st.loss + " %";
                vjit.textContent = st.jitter + " ms";
                // Jitter is omitted deliberately: there is no ?netjitter flag to bake it to.
                elOut.textContent = "netlag=" + st.lag + " netloss=" + st.loss;
            }

            function changed() { render(); push(); }

            // Console entry points, defined on any ?net= boot (the panel needs ?netsim):
            //   eaNetSim(120, 10, 30)          — set lag ms / loss % / jitter ms live
            //   eaNetSim.test(120, 10, 30, 200) — run the impairment self-test on a virtual clock
            //   eaNetSim.show() / .hide()      — summon / dismiss the slider panel
            window.eaNetSim = function (lag, loss, jitter)
            {
                st.lag = clamp(+lag || 0, 0, 500);
                st.loss = clamp(+loss || 0, 0, 100);
                st.jitter = clamp(+jitter || 0, 0, 200);
                render();
                if (!push()) { console.warn('[netsim] game not booted yet'); }
            };
            window.eaNetSim.test = function (lag, loss, jitter, n)
            {
                try
                {
                    var line = DotNet.invokeMethod('EvilAliensWeb', 'debugNetSimTest',
                        +lag || 0, +loss || 0, +jitter || 0, n || 200);
                    console.log(line);
                    if (elRes) { elRes.textContent = line.replace(/^\[netsim\] /, ""); }
                    return line;
                }
                catch (e)
                {
                    console.warn('[netsim] self-test failed (game not booted yet?): ' + e.message);
                    if (!elRes) { return; }
                    elRes.textContent = "self-test: waiting for the runtime…";
                }
            };

            // On demand, so a ?net= boot that did not ask for the panel can still summon
            // the sliders without a reload.
            window.eaNetSim.show = function () { buildPanel(); };
            window.eaNetSim.hide = function () { if (el) { el.style.display = "none"; } };

            if (wantPanel) { buildPanel(); }
        })();
    </script>

    <!-- eaWcTune: live stepper panel for the webcam challenge's difficulty knobs (?wctune,
         card 222beca4). The five WebcamLevel.Tunings[] values were URL-flag only
         (?wchearts= etc.), so every nudge meant a full reload + re-joining the camera.
         This panel +/-'s them in REAL TIME: each edit drives Compat/DebugInput.SetWcTune
         and the level re-resolves on its next tick (hearts snap, on-screen saucer/orb
         speeds rescale). Unlike the ea-hue panel it is NOT built from the URL at load —
         WebcamLevel calls eaWcTune.show() (gated on ?wctune) when the level starts and
         .hide() when it exits, and show() re-seeds it after every applied change so it
         always displays the level's actual resolved values. Built outside #app; a boot
         without ?wctune never calls show(), so the DOM stays byte-identical. -->
    <script>
        window.eaWcTune = (function ()
        {
            var el = null, body = null, out = null, title = null, st = null;

            // The level (C#) is the source of truth; the panel just displays + nudges.
            // Speeds are kept to 2 decimals so repeated +/- doesn't accumulate float fuzz.
            var KNOBS = [
                { key: "hearts",  label: "Hearts",         min: 1,   max: 20, step: 1,    int: true },
                { key: "kills",   label: "Kills to win",   min: 1,   max: 99, step: 1,    int: true },
                { key: "saucers", label: "Max saucers",    min: 1,   max: 15, step: 1,    int: true },

                { key: "spawn",   label: "Spawn gap (ms)",  min: 500,  max: 12000, step: 250, int: true },

                { key: "minemax", label: "Max mines",       min: 1,    max: 12,    step: 1,   int: true },
                { key: "minespawn", label: "Mine spawn (ms)", min: 500, max: 12000, step: 250, int: true }
            ];

            function fmt(k, v) { return k.int ? String(v) : v.toFixed(2); }

            function push()
            {
                try
                {
                    DotNet.invokeMethod('EvilAliensWeb', 'debugSetWcTune',
                        st.hearts, st.kills, st.saucers, st.sspeed, st.pspeed,
                        st.spawn, st.arm, st.charge, st.minemax, st.minespawn);
                }
                catch (e) { console.warn('[wctune] push failed: ' + e.message); }
            }

            function build()
            {
                var css = document.createElement("style");
                css.textContent =
                    "#ea-wctune{position:fixed;top:10px;right:10px;z-index:99999;width:250px;" +
                    "font:12px/1.35 system-ui,Segoe UI,sans-serif;color:#e8e8f0;" +
                    "background:rgba(10,8,20,.85);border:1px solid rgba(150,140,220,.35);" +
                    "border-radius:8px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.5);" +
                    "-webkit-user-select:none;user-select:none;backdrop-filter:blur(2px)}" +
                    "#ea-wctune h4{margin:0;font-size:12px;font-weight:600;letter-spacing:.02em;" +
                    "color:#c9b8ff;cursor:pointer}" +
                    "#ea-wctune h4::after{content:' \\25B4';opacity:.6}" +
                    "#ea-wctune.min h4::after{content:' \\25BE'}" +
                    "#ea-wctune.min .bd{display:none}" +
                    "#ea-wctune .row{display:flex;align-items:center;justify-content:space-between;" +
                    "margin:7px 0}" +
                    "#ea-wctune .row .lb{flex:1}" +
                    "#ea-wctune .v{font-variant-numeric:tabular-nums;color:#9ffcd0;font-weight:600;" +
                    "width:44px;text-align:center}" +
                    "#ea-wctune button{width:26px;height:24px;border-radius:5px;border:1px solid " +
                    "rgba(150,140,220,.45);background:rgba(70,58,120,.55);color:#e8e8f0;" +
                    "font:700 14px/1 system-ui;cursor:pointer;padding:0}" +
                    "#ea-wctune button:hover{background:rgba(110,90,190,.7)}" +
                    "#ea-wctune button:active{background:rgba(143,123,255,.8)}" +
                    "#ea-wctune .reset{width:100%;height:24px;font:600 11px/1 system-ui;margin-top:2px}" +
                    "#ea-wctune .out{margin-top:9px;padding-top:8px;border-top:1px solid " +
                    "rgba(150,140,220,.25);font-family:ui-monospace,Consolas,monospace;font-size:10px;" +
                    "color:#ffd98f;word-break:break-all;cursor:pointer}" +
                    "#ea-wctune .hint{margin-top:6px;font-size:10px;color:#8a86a0;line-height:1.3}";
                document.head.appendChild(css);

                el = document.createElement("div");
                el.id = "ea-wctune";
                var rows = "";
                for (var i = 0; i < KNOBS.length; i++)
                {
                    var k = KNOBS[i];
                    rows += "<div class='row'><span class='lb'>" + k.label + "</span>" +
                        "<button data-k='" + k.key + "' data-d='-1'>&minus;</button>" +
                        "<span class='v' id='wct-" + k.key + "'></span>" +
                        "<button data-k='" + k.key + "' data-d='1'>+</button></div>";
                }
                el.innerHTML =
                    "<h4 id='wct-title'></h4>" +
                    "<div class='bd'>" + rows +
                    "<button class='reset' id='wct-reset'>Reset to tier defaults</button>" +
                    "<div class='out' id='wct-out' title='Click to copy'></div>" +
                    "<div class='hint'>+/&minus; retunes live (works paused too; hearts snap, " +
                    "on-screen speeds rescale). Click the orange row to copy, then paste it to " +
                    "Claude to bake into Tunings[].</div></div>";
                document.body.appendChild(el);
                body = el.querySelector(".bd");
                out = el.querySelector("#wct-out");
                title = el.querySelector("#wct-title");

                title.addEventListener("click", function () { el.classList.toggle("min"); });
                el.addEventListener("click", function (ev)
                {
                    var b = ev.target.closest("button[data-k]");
                    if (!b || !st) { return; }
                    var k = null;
                    for (var i = 0; i < KNOBS.length; i++) { if (KNOBS[i].key === b.dataset.k) { k = KNOBS[i]; } }
                    var v = st[k.key] + k.step * (+b.dataset.d);
                    v = Math.min(k.max, Math.max(k.min, v));
                    st[k.key] = k.int ? Math.round(v) : Math.round(v * 100) / 100;
                    render();
                    push();
                });
                el.querySelector("#wct-reset").addEventListener("click", function ()
                {
                    // C# clears the overrides, re-resolves the tier row (+ any ?wc* URL
                    // flags) and calls show() again with the real values — no local math.
                    try { DotNet.invokeMethod('EvilAliensWeb', 'debugClearWcTune'); }
                    catch (e) { console.warn('[wctune] reset failed: ' + e.message); }
                });
                out.addEventListener("click", function ()
                {
                    var t = out.textContent;
                    if (navigator.clipboard) { navigator.clipboard.writeText(t).catch(function () { }); }
                    var old = out.style.color; out.style.color = "#9ffcd0";
                    setTimeout(function () { out.style.color = old; }, 250);
                });
            }

            function render()
            {
                title.textContent = "Webcam tuner — " + st.tier;
                for (var i = 0; i < KNOBS.length; i++)
                {
                    var k = KNOBS[i];
                    el.querySelector("#wct-" + k.key).textContent = fmt(k, st[k.key]);
                }
                out.textContent = st.tier + ": { Hearts = " + st.hearts + ", KillTarget = " + st.kills +
                    ", MaxSaucers = " + st.saucers + ", SaucerSpeedMul = " + st.sspeed +
                    "f, PlasmaSpeedMul = " + st.pspeed + "f, SpawnIntervalMs = " + st.spawn +
                    "f, ArmDelayMs = " + st.arm + "f, ChargeTimeMs = " + st.charge +
                    "f, MaxMines = " + st.minemax + ", MineSpawnMs = " + st.minespawn +
                    "f, MineLifeMs = " + st.minelife + "f, MothershipMs = " + st.mothership + "f }";
            }

            return {
                // Called from WebcamLevel (C#) at level start and after every applied
                // change, with the ACTUAL resolved values — so this both shows and re-seeds.
                show: function (tier, hearts, kills, saucers, sspeed, pspeed, spawn, arm, charge, minemax, minespawn, minelife, mothership)
                {
                    st = {
                        tier: tier, hearts: hearts, kills: kills, saucers: saucers,
                        sspeed: Math.round(sspeed * 100) / 100,
                        pspeed: Math.round(pspeed * 100) / 100,
                        spawn: Math.round(spawn * 100) / 100,
                        arm: Math.round(arm * 100) / 100,
                        charge: Math.round(charge * 100) / 100,
                        minemax: minemax,
                        minespawn: Math.round(minespawn),
                        // display-only (no stepper) — URL-tunable, shown in the bake row
                        minelife: Math.round(minelife),
                        mothership: Math.round(mothership)
                    };
                    if (!el) { build(); }
                    render();
                    el.style.display = "block";
                },
                hide: function () { if (el) { el.style.display = "none"; } }
            };
        })();
    </script>

    <!-- eaTexViewer: the control panel for the ?texviewer per-sprite texture-format viewer
         (Compat/TexViewerScene.cs). The SCENE renders the PNG (RAW) vs .dds (DXT) comparison
         through the real GPU pipeline; this panel is the clickable UI the Trello card asked for
         — flip, per-sprite DXT/RAW/PNG pick, cycle all images, and a Save button that writes the
         decision into tools/textures/textures.config (via the dev-only POST /api/texdecide on
         web/DevServer). TexViewerScene.PushPanel calls eaTexViewer.show(json) on every state
         change; the panel pokes DebugInput.SetTexViewer (debugSetTexViewer) back with commands.
         Built outside #app; a boot without ?texviewer never calls show(), so the DOM stays
         byte-identical. -->
    <script>
        window.eaTexViewer = (function ()
        {
            var el = null, st = null, statusEl = null;

            function cmd(c)
            {
                try { DotNet.invokeMethod('EvilAliensWeb', 'debugSetTexViewer', c); }
                catch (e) { console.warn('[texviewer] cmd failed: ' + e.message); }
            }

            function build()
            {
                var css = document.createElement("style");
                css.textContent =
                    "#ea-texv{position:fixed;top:10px;right:10px;z-index:99999;width:264px;" +
                    "font:12px/1.4 system-ui,Segoe UI,sans-serif;color:#e8e8f0;" +
                    "background:rgba(10,8,20,.86);border:1px solid rgba(150,180,220,.35);" +
                    "border-radius:8px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.5);" +
                    "-webkit-user-select:none;user-select:none;backdrop-filter:blur(2px)}" +
                    "#ea-texv h4{margin:0 0 6px;font-size:12px;font-weight:600;color:#b8d4ff;cursor:pointer}" +
                    "#ea-texv h4::after{content:' \\25B4';opacity:.6}" +
                    "#ea-texv.min h4::after{content:' \\25BE'}" +
                    "#ea-texv.min .bd{display:none}" +
                    "#ea-texv .nm{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#9ffcd0;" +
                    "word-break:break-all;margin-bottom:2px}" +
                    "#ea-texv .meta{font-size:10.5px;color:#a8a4c0;margin-bottom:7px}" +
                    "#ea-texv .rowb{display:flex;gap:5px;margin:6px 0}" +
                    "#ea-texv button{flex:1;height:26px;border-radius:5px;border:1px solid rgba(150,180,220,.45);" +
                    "background:rgba(60,70,120,.55);color:#e8e8f0;font:600 11px/1 system-ui;cursor:pointer;padding:0}" +
                    "#ea-texv button:hover{background:rgba(90,110,190,.7)}" +
                    "#ea-texv button:active{background:rgba(123,150,255,.85)}" +
                    "#ea-texv button.on{background:rgba(123,150,255,.8);border-color:#9fc0ff}" +
                    "#ea-texv .lab{font-size:10.5px;color:#8a86a0;margin:6px 0 2px}" +
                    "#ea-texv .picks label{display:inline-flex;align-items:center;gap:3px;margin-right:9px;cursor:pointer}" +
                    "#ea-texv .grid{display:flex;gap:6px;align-items:center;margin-top:5px;font-size:11px}" +
                    "#ea-texv .grid input{width:38px;background:rgba(255,255,255,.08);border:1px solid rgba(150,180,220,.4);" +
                    "color:#e8e8f0;border-radius:4px;padding:2px 4px}" +
                    "#ea-texv .save{width:100%;height:28px;margin-top:8px;font:700 12px/1 system-ui;" +
                    "background:rgba(60,140,90,.7);border-color:rgba(120,220,150,.5)}" +
                    "#ea-texv .save:hover{background:rgba(80,180,110,.85)}" +
                    "#ea-texv .status{margin-top:6px;font-size:10.5px;color:#ffd98f;min-height:13px;" +
                    "font-family:ui-monospace,Consolas,monospace;word-break:break-all}" +
                    "#ea-texv .hint{margin-top:6px;font-size:10px;color:#8a86a0;line-height:1.3}";
                document.head.appendChild(css);

                el = document.createElement("div");
                el.id = "ea-texv";
                el.innerHTML =
                    "<h4 id='tv-title'>Texture format viewer</h4>" +
                    "<div class='bd'>" +
                    "<div class='nm' id='tv-nm'></div>" +
                    "<div class='meta' id='tv-meta'></div>" +
                    "<div class='rowb'><button id='tv-prev'>&larr; Prev</button>" +
                    "<button id='tv-next'>Next &rarr;</button></div>" +
                    "<div class='rowb'><button id='tv-flip'>Flip RAW/DXT</button>" +
                    "<button id='tv-mode'>Split</button></div>" +
                    "<div class='rowb'><button id='tv-zout'>&minus; Zoom</button>" +
                    "<button id='tv-fit'>Fit</button><button id='tv-zin'>Zoom +</button></div>" +
                    "<div class='lab'>Format decision</div>" +
                    "<div class='picks'>" +
                    "<label><input type='radio' name='tv-pick' value='0'>DXT</label>" +
                    "<label><input type='radio' name='tv-pick' value='1'>RAW</label>" +
                    "<label><input type='radio' name='tv-pick' value='2'>PNG</label></div>" +
                    "<div class='grid' id='tv-grid'>DXT grid: cols <input id='tv-cols' type='number' min='1'>" +
                    "rows <input id='tv-rows' type='number' min='1'></div>" +
                    "<button class='save' id='tv-save'>Save to textures.config</button>" +
                    "<div class='status' id='tv-status'></div>" +
                    "<div class='hint'>Flip (or Enter) to A/B RAW vs DXT; Split shows RAW|DXT &mdash; drag the gold line to sweep. " +
                    "Pick a format and Save writes the line — then run " +
                    "<code>python tools/textures/build_textures.py</code>.</div></div>";
                document.body.appendChild(el);
                statusEl = el.querySelector("#tv-status");

                el.querySelector("#tv-title").addEventListener("click", function () { el.classList.toggle("min"); });
                el.querySelector("#tv-prev").addEventListener("click", function () { cmd("prev"); });
                el.querySelector("#tv-next").addEventListener("click", function () { cmd("next"); });
                el.querySelector("#tv-flip").addEventListener("click", function () { cmd("flip"); });
                el.querySelector("#tv-mode").addEventListener("click", function ()
                {
                    cmd("mode:" + (st && st.mode === 1 ? 0 : 1));
                });
                el.querySelector("#tv-zin").addEventListener("click", function ()
                {
                    if (st) { cmd("zoom:" + (st.zoom * 1.25).toFixed(3)); }
                });
                el.querySelector("#tv-zout").addEventListener("click", function ()
                {
                    if (st) { cmd("zoom:" + (st.zoom * 0.8).toFixed(3)); }
                });
                el.querySelector("#tv-fit").addEventListener("click", function () { cmd("fit"); });
                el.querySelectorAll("input[name='tv-pick']").forEach(function (r)
                {
                    r.addEventListener("change", function ()
                    {
                        if (st) { st.pick = +r.value; cmd("pick:" + r.value); render(); }
                    });
                });
                el.querySelector("#tv-save").addEventListener("click", save);
            }

            function save()
            {
                if (!st) { return; }
                var fmt = st.pick === 0 ? "dxt" : (st.pick === 1 ? "raw" : "png");
                var cols = Math.max(1, parseInt(el.querySelector("#tv-cols").value, 10) || 1);
                var rows = Math.max(1, parseInt(el.querySelector("#tv-rows").value, 10) || 1);
                statusEl.textContent = "saving…";
                fetch("api/texdecide", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ asset: st.asset, format: fmt, cols: cols, rows: rows })
                }).then(function (r) { return r.json(); }).then(function (j)
                {
                    if (j.ok)
                    {
                        st.current = fmt;
                        statusEl.style.color = "#9ffcd0";
                        statusEl.textContent = fmt === "png" ? "saved: removed (png default)" : ("saved: " + j.line);
                        render();
                        cmd("next");   // auto-advance so each decision is a single click
                    }
                    else
                    {
                        statusEl.style.color = "#ff9f8f";
                        statusEl.textContent = "error: " + (j.error || "unknown");
                    }
                }).catch(function (e)
                {
                    statusEl.style.color = "#ff9f8f";
                    statusEl.textContent = "save failed (" + e.message + "). Serve via web/DevServer.";
                });
            }

            function render()
            {
                el.querySelector("#tv-nm").textContent = (st.index + 1) + " / " + st.count + "  " + st.asset;
                var pngKB = st.pngKB, ddsKB = st.ddsKB, rawKB = st.rawKB;
                el.querySelector("#tv-meta").innerHTML =
                    st.w + "&times;" + st.h + " &nbsp; png " + pngKB + "KB &nbsp; dds " + ddsKB +
                    "KB &nbsp; raw " + rawKB + "KB<br>config: <b>" + st.current + "</b>" +
                    (st.hasDds ? "" : " &nbsp;<span style='color:#ff9f8f'>(no DXT preview)</span>");
                el.querySelector("#tv-flip").textContent = st.mode === 1
                    ? "Split: RAW|DXT" : (st.view === 1 ? "Showing DXT" : "Showing RAW");
                el.querySelector("#tv-flip").classList.toggle("on", st.mode !== 1 && st.view === 1);
                // Label with the CURRENT mode (like the "Showing RAW/DXT" sibling), so the "on"
                // highlight and the text agree — a highlighted button reads as the active mode,
                // not the destination. Clicking still toggles to the other mode.
                el.querySelector("#tv-mode").textContent = st.mode === 1 ? "Split mode" : "Flip mode";
                el.querySelector("#tv-mode").classList.toggle("on", st.mode === 1);
                el.querySelectorAll("input[name='tv-pick']").forEach(function (r)
                {
                    r.checked = (+r.value === st.pick);
                });
                el.querySelector("#tv-grid").style.display = st.pick === 0 ? "flex" : "none";
                el.querySelector("#tv-cols").value = st.cols;
                el.querySelector("#tv-rows").value = st.rows;
                statusEl.style.color = "#ffd98f";
            }

            return {
                // Called from TexViewerScene (C#) on every state change with a JSON blob.
                show: function (json)
                {
                    try { st = JSON.parse(json); } catch (e) { return; }
                    if (!st || !st.count) { if (el) { el.style.display = "none"; } return; }
                    if (!el) { build(); }
                    render();
                    el.style.display = "block";
                },
                hide: function () { if (el) { el.style.display = "none"; } }
            };
        })();
    </script>

    <!-- eaFps: the dev-build frame profiler HUD (card 22e655b5).

         WHY IT IS NOT JUST AN FPS COUNTER. The loop is rAF-driven, so the frame RATE is
         vsync-gated: at 60Hz a 3ms frame and a 15ms frame both read "60 fps", right up until
         the game falls off the cliff. So the HUD leads with fps but the number that actually
         moves when you optimize is HEADROOM (1000 / frame work ms) — and under it, the
         per-phase breakdown from Compat/FrameProfiler that says WHICH part costs the ms.

         Built outside #app so it survives Blazor's mount, and fixed-position top-left: the
         other panels (eaWalls/eaSpider/...) and the fullscreen button all live top-right, and
         in a 16:9 window the left letterbox bar is dead space anyway. Fullscreen targets
         document.documentElement, so it stays visible there too.

         VISIBLE BY DEFAULT IN DEV BUILDS, INVISIBLE IN THE PUBLISHED ONE: keyed off
         window.eaBuildHash === 'dev' (the deploy stamps a real fingerprint at publish). That
         is exactly "all dev builds" — Debug *and* a local Release publish — with no #if DEBUG
         and no behavioural divergence between configurations. The C# accumulators are armed by
         this panel, so a shipped build never touches a stopwatch.

         Flags: ?fpshud force on (works on the live site) · ?fpshud=full force on, expanded ·
         ?nofps hide in a dev build (keeps harness/showcase screenshots clean) ·
         ?fpsuncapped boot with the rAF cap off · ?fpsgpu boot with gl.finish() frame sync on.
         Console: eaFps() toggles compact/expanded/off, eaFps.stats(), eaFps.uncap(b),
         eaFps.gpu(b), eaFps.test(workMs, intervalMs, frames). ?fps= is NOT this — that is the
         sprite harness' playback rate. -->
    <script>
        window.eaFps = (function ()
        {
            var q = window.location.search || "";
            var forced = /[?&]fpshud\b/i.test(q);
            var suppressed = /[?&]nofps\b/i.test(q);
            var isDevBuild = String(window.eaBuildHash || 'dev') === 'dev';
            var expanded = /[?&]fpshud=full\b/i.test(q);

            // Screenshot-driven verification is how nearly everything in this project is checked
            // (sprite harness, showcase scenes, the texture viewer), and those scenes draw their
            // own readouts in the top-left design corner -- exactly where this panel sits. So a
            // dev build suppresses the HUD on those pages by default; ?fpshud forces it back on.
            var showcase = /[?&](harness|textshot|bulletshot|lazershot|castbrain|castshow|texviewer|gamebrowser|spiderphase|wcmothershipfreeze|ripplephase)\b/i.test(q);
            var visible = forced || (isDevBuild && !suppressed && !showcase);

            var el = null, armed = false, wasUnfocused = true, poll = null;
            var glCalls = 0, glWindow = [], glPatched = false;
            var gpuMs = 0, gl = null, gpuSync = /[?&]fpsgpu\b/i.test(q);
            // Shortest frame interval ever observed. Under vsync that converges on the display's
            // refresh period within a second or two of idling, which is the ONLY honest budget
            // for the sparkline: the mean interval inflates in lockstep with the work, so using
            // it would paint an overloaded 25ms frame green against its own 33ms delivery rate.
            // Monotone, so a bad stretch can never raise it.
            var minIntervalMs = Infinity, lastFrameAt = 0;

            // Draw-call counting. Patch the PROTOTYPES rather than a live context: KNI creates
            // the context itself (nkast.Wasm.Canvas), so this works whichever GL version it
            // picks and regardless of whether we run before or after creation. The first call
            // through also hands us the context for gl.finish(). Only installed when the HUD is
            // up — a shipped build never wraps a hot GL entry point.
            function patchGl()
            {
                if (glPatched) { return; }
                glPatched = true;
                ["WebGLRenderingContext", "WebGL2RenderingContext"].forEach(function (name)
                {
                    var C = window[name];
                    if (!C || !C.prototype) { return; }
                    ["drawElements", "drawArrays", "drawElementsInstanced",
                     "drawArraysInstanced", "drawRangeElements"].forEach(function (m)
                    {
                        var orig = C.prototype[m];
                        if (typeof orig !== "function") { return; }
                        C.prototype[m] = function ()
                        {
                            glCalls++;
                            if (!gl) { gl = this; }
                            return orig.apply(this, arguments);
                        };
                    });
                });
            }

            // Runs right after each tick returns (window.eaFpsAfterTick, called from tickJS).
            // Rolls the per-frame draw-call count, and — only in gpu-sync mode — blocks on
            // gl.finish() to convert the GPU's asynchronous work into a measurable wait.
            // WebGL commands are QUEUED, so without this the CPU-derived headroom overstates a
            // GPU-bound frame; the stall is the price of finding that out, hence opt-in.
            function afterTick()
            {
                glWindow.push(glCalls);
                if (glWindow.length > 120) { glWindow.shift(); }
                glCalls = 0;
                // Track the shortest interval we have ever been delivered (see minIntervalMs).
                // Only while focused and capped: an unfocused tab's throttled intervals are
                // garbage, and the uncapped pump's intervals are not a display budget at all.
                var now = performance.now();
                if (lastFrameAt && !window.eaFpsUncapped && !document.hidden && document.hasFocus())
                {
                    var dt = now - lastFrameAt;
                    if (dt > 1 && dt < minIntervalMs) { minIntervalMs = dt; }
                }
                lastFrameAt = now;
                if (gpuSync && gl)
                {
                    var t0 = performance.now();
                    try { gl.finish(); }
                    catch (e)
                    {
                        console.warn('[fps] gl.finish() failed, turning gpu sync off: ' + ((e && e.message) || e));
                        setGpuSync(false);   // route through the setter so the checkbox follows
                        return;
                    }
                    // Smoothed, or it reads as noise: the wait is bimodal frame to frame.
                    gpuMs += (performance.now() - t0 - gpuMs) * 0.1;
                }
                else { gpuMs = 0; }
            }

            function mean(a)
            {
                if (!a.length) { return 0; }
                var s = 0;
                for (var i = 0; i < a.length; i++) { s += a[i]; }
                return s / a.length;
            }

            function build()
            {
                var css = document.createElement("style");
                css.textContent =
                    "#ea-fps{position:fixed;top:10px;left:10px;z-index:99998;width:246px;" +
                    "font:12px/1.35 system-ui,Segoe UI,sans-serif;color:#e8e8f0;" +
                    "background:rgba(10,8,20,.82);border:1px solid rgba(140,170,220,.35);" +
                    "border-radius:8px;padding:8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.5);" +
                    "-webkit-user-select:none;user-select:none;backdrop-filter:blur(2px);" +
                    // pointer-events:none is deliberate — this thing sits over a shoot-'em-up
                    // where Mouse1 anywhere on the canvas fires. A clickable panel would eat
                    // every shot aimed at that corner. Only the tiny mode tag (the expand/
                    // collapse button) and the mode checkboxes opt back in below, so the dead
                    // zone is ~54x14px instead of the whole panel.
                    "pointer-events:none}" +
                    "#ea-fps.compact{width:186px}" +
                    "#ea-fps .hdr{display:flex;align-items:baseline;gap:6px}" +
                    "#ea-fps .big{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;color:#9ffcd0}" +
                    "#ea-fps .u{font-size:11px;color:#8a86a0}" +
                    "#ea-fps .tag{margin-left:auto;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;" +
                    "color:#8a86a0;border:1px solid rgba(140,170,220,.3);border-radius:4px;padding:1px 5px;" +
                    "pointer-events:auto;cursor:pointer}" +
                    "#ea-fps .tag:hover{color:#e8e8f0;border-color:rgba(140,170,220,.7)}" +
                    "#ea-fps .tag.hot{color:#ffd98f;border-color:rgba(255,217,143,.5)}" +
                    "#ea-fps .sub{margin-top:2px;font-variant-numeric:tabular-nums;color:#b8d4ff}" +
                    "#ea-fps .sub b{color:#ffd98f;font-weight:600}" +
                    "#ea-fps .warn{margin-top:4px;font-size:10.5px;color:#ffb0b0;line-height:1.3}" +
                    "#ea-fps .body{margin-top:7px;padding-top:7px;border-top:1px solid rgba(140,170,220,.25)}" +
                    "#ea-fps canvas{display:block;width:100%;height:34px;border-radius:3px;" +
                    "background:rgba(255,255,255,.04)}" +
                    "#ea-fps table{width:100%;border-collapse:collapse;margin-top:6px;" +
                    "font-variant-numeric:tabular-nums}" +
                    "#ea-fps td{padding:1px 0;font-size:11px}" +
                    "#ea-fps td.k{color:#b8b4c8}" +
                    "#ea-fps td.k.sub2{padding-left:9px;color:#8a86a0}" +
                    "#ea-fps td.v{text-align:right;width:44px;color:#9ffcd0}" +
                    "#ea-fps td.bar{width:56px;padding-left:6px}" +
                    "#ea-fps td.bar i{display:block;height:6px;border-radius:2px;background:#6fb0ff;min-width:1px}" +
                    "#ea-fps td.k.sub2+td+td.bar i{background:#4a7cc0}" +
                    "#ea-fps .gl{margin-top:6px;font-size:11px;color:#ffd98f;font-variant-numeric:tabular-nums}" +
                    "#ea-fps .modes{margin-top:7px;display:flex;gap:10px;font-size:10.5px;color:#b8b4c8;" +
                    "pointer-events:auto}" +
                    "#ea-fps .modes label{display:flex;gap:4px;align-items:center;cursor:pointer}" +
                    "#ea-fps .hint{margin-top:6px;font-size:10px;color:#8a86a0;line-height:1.35}";
                document.head.appendChild(css);

                el = document.createElement("div");
                el.id = "ea-fps";
                el.innerHTML =
                    '<div class="hdr"><span class="big" id="eaf-fps">--</span><span class="u">fps</span>' +
                    '<span class="tag" id="eaf-mode" title="Click to expand / collapse the frame breakdown">vsync</span></div>' +
                    '<div class="sub"><span id="eaf-cpu">--</span> ms/frame &rarr; <b id="eaf-hr">--</b> fps headroom</div>' +
                    '<div class="warn" id="eaf-warn" style="display:none"></div>' +
                    '<div class="body" id="eaf-body">' +
                    '<canvas id="eaf-spark" width="452" height="68"></canvas>' +
                    '<table id="eaf-rows"></table>' +
                    '<div class="gl" id="eaf-gl"></div>' +
                    '<div class="modes">' +
                    '<label><input type="checkbox" id="eaf-uncap" autocomplete="off"> uncap</label>' +
                    '<label><input type="checkbox" id="eaf-gpu" autocomplete="off"> gpu sync</label>' +
                    '</div>' +
                    '<div class="hint" id="eaf-hint"></div>' +
                    '</div>';
                document.body.appendChild(el);

                el.querySelector("#eaf-mode").addEventListener("click", function ()
                {
                    setExpanded(!expanded);
                });

                var un = el.querySelector("#eaf-uncap");
                un.checked = window.eaFpsUncapped;
                un.addEventListener("change", function () { setUncapped(un.checked); });
                var gp = el.querySelector("#eaf-gpu");
                gp.checked = gpuSync;
                gp.addEventListener("change", function () { setGpuSync(gp.checked); });

                setExpanded(expanded);
            }

            function setExpanded(on)
            {
                expanded = !!on;
                if (!el) { return; }
                el.classList.toggle("compact", !expanded);
                el.querySelector("#eaf-body").style.display = expanded ? "block" : "none";
            }

            function setUncapped(on)
            {
                window.eaFpsUncapped = !!on;
                if (el) { el.querySelector("#eaf-uncap").checked = window.eaFpsUncapped; }
                // The rate changes the instant the pump does, so the old samples describe a
                // different loop. Re-arm to drop them rather than average across the switch.
                rearm();
            }

            function setGpuSync(on)
            {
                gpuSync = !!on;
                gpuMs = 0;
                if (el) { el.querySelector("#eaf-gpu").checked = gpuSync; }
                rearm();
            }

            function rearm()
            {
                try { DotNet.invokeMethod('EvilAliensWeb', 'debugFpsProfile', true); armed = true; }
                catch (e) { armed = false; }
            }

            // The section rows. `update` is the PARENT of the three indented sub-rows, so only
            // update + the draw rows + other sum to the tick — the sub-rows must never be added
            // in or the total double-counts.
            var ROWS = [
                { k: "update",     label: "update",     sub: false },
                { k: "components", label: "components", sub: true },
                { k: "collision",  label: "collision",  sub: true },
                { k: "net",        label: "net",        sub: true },
                { k: "scene",      label: "draw scene", sub: false },
                { k: "post",       label: "post fx",    sub: false },
                { k: "present",    label: "present",    sub: false },
                { k: "swap",       label: "swap (gpu)", sub: false }
            ];

            function renderRows(s, otherMs, tickMs)
            {
                var html = "", scale = Math.max(tickMs, 0.001);
                for (var i = 0; i < ROWS.length; i++)
                {
                    var r = ROWS[i], v = s[r.k] || 0;
                    html += '<tr><td class="k' + (r.sub ? " sub2" : "") + '">' + r.label + '</td>'
                        + '<td class="v">' + v.toFixed(2) + '</td>'
                        + '<td class="bar"><i style="width:' + Math.min(100, v / scale * 100).toFixed(1) + '%"></i></td></tr>';
                }
                html += '<tr><td class="k">other</td><td class="v">' + otherMs.toFixed(2) + '</td>'
                    + '<td class="bar"><i style="width:' + Math.min(100, otherMs / scale * 100).toFixed(1) + '%"></i></td></tr>';
                el.querySelector("#eaf-rows").innerHTML = html;
            }

            // Frame-time sparkline over the profiler's own 120-frame window. The bar colour is
            // the budget verdict, not decoration: green under the vsync budget, amber over it,
            // red over double — a stutter you can see in the graph but never in the mean.
            function renderSpark(frames, budgetMs)
            {
                var c = el.querySelector("#eaf-spark");
                var ctx = c.getContext("2d");
                var w = c.width, h = c.height;
                ctx.clearRect(0, 0, w, h);
                if (!frames || !frames.length) { return; }
                var peak = 0;
                for (var i = 0; i < frames.length; i++) { if (frames[i] > peak) { peak = frames[i]; } }
                // Never scale to less than the budget, or a healthy flat run looks alarming.
                var top = Math.max(peak * 1.15, budgetMs * 1.3, 1);
                var bw = w / frames.length;
                for (var j = 0; j < frames.length; j++)
                {
                    var v = frames[j];
                    var bh = Math.max(1, (v / top) * h);
                    ctx.fillStyle = (v > budgetMs * 2) ? "#ff7a7a" : (v > budgetMs ? "#ffd98f" : "#6fe3b0");
                    ctx.fillRect(j * bw, h - bh, Math.max(1, bw - 0.5), bh);
                }
                // The budget line (one vsync interval): bars crossing it are dropped frames.
                var y = h - (budgetMs / top) * h;
                if (y > 0 && y < h)
                {
                    ctx.strokeStyle = "rgba(184,212,255,.55)";
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            function refresh()
            {
                if (!el) { return; }
                // document.hidden / hasFocus is the AUTHORITATIVE throttle signal: a backgrounded
                // tab still delivers ~1 rAF/second, which no timing test inside the game can tell
                // apart from a very slow frame. Re-arm on regaining focus so the throttled garbage
                // is dropped instead of poisoning the average for the next two seconds.
                var unfocused = document.hidden || !document.hasFocus();
                var warn = el.querySelector("#eaf-warn");
                if (!armed || (wasUnfocused && !unfocused)) { rearm(); }
                wasUnfocused = unfocused;
                if (unfocused)
                {
                    warn.style.display = "block";
                    warn.textContent = "⚠ unfocused — a background tab throttles rAF, readings are meaningless";
                    return;
                }

                var raw;
                try { raw = DotNet.invokeMethod('EvilAliensWeb', 'debugFpsStats'); }
                catch (e) { warn.style.display = "block"; warn.textContent = "waiting for the runtime…"; return; }
                var d;
                try { d = JSON.parse(raw); } catch (e) { return; }
                if (!d.on) { rearm(); return; }
                if (d.stale)
                {
                    warn.style.display = "block";
                    warn.textContent = "collecting samples…";
                    return;
                }
                warn.style.display = "none";

                var glMean = mean(glWindow);
                try { DotNet.invokeMethod('EvilAliensWeb', 'debugFpsGlCalls', Math.round(glMean)); }
                catch (e) { /* runtime went away between calls — the next poll retries */ }

                // Headroom is CPU-derived; in gpu-sync mode the measured GPU wait is added in,
                // which is the whole reason that mode exists. Label which one is on screen.
                var cost = d.tickMs + (gpuSync ? gpuMs : 0);
                var headroom = gpuSync ? (cost > 0.0001 ? 1000 / cost : 0) : d.headroomFps;
                el.querySelector("#eaf-fps").textContent = d.fps.toFixed(1);
                el.querySelector("#eaf-cpu").textContent = cost.toFixed(2);
                el.querySelector("#eaf-hr").textContent = headroom.toFixed(0);
                var mode = el.querySelector("#eaf-mode");
                mode.textContent = window.eaFpsUncapped ? "uncapped" : "vsync";
                mode.classList.toggle("hot", !!window.eaFpsUncapped);

                if (!expanded) { return; }
                renderRows(d.sections || {}, d.otherMs || 0, d.tickMs);
                // Budget = the display's refresh period, estimated as the SHORTEST interval ever
                // delivered — NOT the current mean. The mean rises with the workload, so a frame
                // that is blowing the budget would be measured against its own degraded delivery
                // rate and painted green. Falls back to 60Hz until the estimate has settled.
                var budget = isFinite(minIntervalMs) ? minIntervalMs : 16.7;
                renderSpark(d.frames, budget);
                el.querySelector("#eaf-gl").textContent =
                    Math.round(glMean) + " GL draw calls/frame"
                    + (gpuSync ? "  ·  gpu wait " + gpuMs.toFixed(2) + " ms" : "");
                el.querySelector("#eaf-hint").textContent =
                    "p95 " + d.tickP95Ms.toFixed(2) + " ms"
                    + (window.eaFpsUncapped
                        ? "  ·  uncapped: fps is real throughput"
                        : "  ·  fps is vsync-capped; headroom is not");
            }

            function show(mode)
            {
                if (!el) { patchGl(); build(); window.eaFpsAfterTick = afterTick; }
                el.style.display = "block";
                if (mode === "full") { setExpanded(true); }
                else if (mode === "compact") { setExpanded(false); }
                rearm();
                if (!poll) { poll = setInterval(refresh, 250); }
                refresh();
            }

            function hide()
            {
                if (el) { el.style.display = "none"; }
                if (poll) { clearInterval(poll); poll = null; }
                try { DotNet.invokeMethod('EvilAliensWeb', 'debugFpsProfile', false); } catch (e) { }
                armed = false;
                // Hiding must actually STOP the work, not just stop showing it. Left armed, the
                // per-frame hook keeps counting, gpu sync keeps stalling on gl.finish() every
                // frame, and — worst — the uncapped pump keeps the loop off vsync at full tilt
                // with nothing on screen to say so.
                window.eaFpsAfterTick = null;
                window.eaFpsUncapped = false;
                gpuSync = false;
                gpuMs = 0;
            }

            var api = function (arg)
            {
                if (arg === false || arg === "off") { hide(); return "fps hud off"; }
                if (arg === "full" || arg === true) { show("full"); return "fps hud: expanded"; }
                if (arg === "compact") { show("compact"); return "fps hud: compact"; }
                // No argument: cycle compact -> expanded -> off, so one repeated call from the
                // console reaches every state.
                if (!el || el.style.display === "none") { show("compact"); return "fps hud: compact"; }
                if (!expanded) { setExpanded(true); return "fps hud: expanded"; }
                hide();
                return "fps hud off";
            };

            // The console one-liner carries the SAME focus guard as the HUD. C# can't see
            // document.hasFocus(), and an unfocused-but-visible window gets its rAF throttled to
            // a rate the C#-side staleness test (mean interval > 100ms) does NOT catch — so the
            // profiler would report a confident, badly wrong frame cost. Prefixing here is what
            // stops a reading taken while you were tabbed away from being believed.
            api.stats = function ()
            {
                try
                {
                    var line = DotNet.invokeMethod('EvilAliensWeb', 'debugFpsStatsLine');
                    if (document.hidden || !document.hasFocus())
                    {
                        return "[UNFOCUSED — readings are meaningless, focus the window] " + line;
                    }
                    return line;
                }
                catch (e) { return "not booted"; }
            };
            api.uncap = function (on) { setUncapped(on !== false); return "uncapped: " + window.eaFpsUncapped; };
            api.gpu = function (on) { setGpuSync(on !== false); return "gpu sync: " + gpuSync; };
            // Data self-test for the window maths — the vsync trap as an assertion: `work` ms of
            // work delivered every `interval` ms MUST read 1000/interval fps and 1000/work
            // headroom. A profiler that reported the work rate as "fps" fails this loudly.
            api.test = function (workMs, intervalMs, frames)
            {
                var w = Number(workMs) || 5, iv = Number(intervalMs) || 16.7, n = Number(frames) || 120;
                try { return DotNet.invokeMethod('EvilAliensWeb', 'debugFpsSelfTest', w, iv, n); }
                catch (e) { return "not booted"; }
            };

            // ?fpsuncapped / ?fpsgpu are LOOP flags, applied whether or not the panel shows:
            // they change how the game is driven, and wanting the measurement without the
            // overlay (?nofps&fpsuncapped, or either flag on the published site) is legitimate.
            // Both need the per-tick hook, so arming them pulls the machinery up on its own.
            var uncapAsked = /[?&]fpsuncapped\b/i.test(q);
            if (uncapAsked || gpuSync)
            {
                patchGl();
                window.eaFpsAfterTick = afterTick;
                window.eaFpsUncapped = uncapAsked;
            }
            if (visible)
            {
                // The runtime isn't up at parse time; showing is cheap and idempotent, and
                // rearm() retries on every poll until debugFpsProfile stops throwing.
                show(expanded ? "full" : "compact");
            }
            return api;
        })();
    </script>
</body>

</html>
